apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-init-job
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.initJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.initJob.activeDeadlineSeconds }}
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: download-synthea
          image: "{{ .Values.initJob.curl.image.registry }}/{{ .Values.initJob.curl.image.repository }}:{{ .Values.initJob.curl.image.tag }}"
          command: ["/bin/sh", "-c"]
          workingDir: /downloads
          env:
            - name: SYNTHEA_VERSION
              value: {{ .Values.initJob.synthea.version | quote }}
            - name: SYNTHEA_SHA256
              value: {{ .Values.initJob.synthea.sha256 | quote }}
          args:
            - |
              curl -fLsSO "https://github.com/synthetichealth/synthea/releases/download/${SYNTHEA_VERSION}/synthea-with-dependencies.jar"
              echo "${SYNTHEA_SHA256}  synthea-with-dependencies.jar" | sha256sum -c -
              ls -lsa /downloads
          volumeMounts:
            - name: downloads
              mountPath: /downloads
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # the page cache from writing the Synthea jar counts towards the limit, 32Mi was getting OOMKilled
          resources:
            limits:
              cpu: 100m
              ephemeral-storage: 2Gi
              memory: 128Mi
            requests:
              cpu: 50m
              ephemeral-storage: 2Gi
              memory: 128Mi
        - name: wait-for-pathling-server
          image: "{{ .Values.initJob.curl.image.registry }}/{{ .Values.initJob.curl.image.repository }}:{{ .Values.initJob.curl.image.tag }}"
          command: ["/bin/sh", "-c"]
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          args:
            - |
              until [ "$(curl -s -o /dev/null -L -w "%{http_code}" "${PATHLING_SERVER_URL}/fhir/metadata")" == "200" ]; do
                  echo "$(date): Waiting for pathling server @ ${PATHLING_SERVER_URL} to be up";
                  sleep 5;
              done;
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
        - name: generate-resources
          # might as well use this image since it has java installed
          image: "{{ .Values.initJob.fhirToLakehouse.image.registry }}/{{ .Values.initJob.fhirToLakehouse.image.repository }}:{{ .Values.initJob.fhirToLakehouse.image.tag }}"
          command: ["/bin/sh", "-c"]
          workingDir: /downloads
          env:
            - name: SYNTHEA_SEED
              value: "20250916"
          args:
            - |
              java -jar /downloads/synthea-with-dependencies.jar -s $SYNTHEA_SEED -cs $SYNTHEA_SEED -r $SYNTHEA_SEED -p 100 -c /tmp/config/synthea.properties
          volumeMounts:
            - name: downloads
              mountPath: /downloads
            - name: tmp
              mountPath: /tmp
            - name: init-job-config
              mountPath: /tmp/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 2000m
              ephemeral-storage: 2Gi
              memory: 1500Mi
            requests:
              cpu: 50m
              ephemeral-storage: 2Gi
              memory: 1500Mi
        - name: upload-resources
          image: "{{ .Values.initJob.awsCli.image.registry }}/{{ .Values.initJob.awsCli.image.repository }}:{{ .Values.initJob.awsCli.image.tag }}"
          command: ["/bin/sh", "-c"]
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          env:
            - name: HOME
              value: /tmp
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-password
          args:
            - |
              aws s3api head-bucket --bucket import 2>/dev/null || aws s3api create-bucket --bucket import
              aws s3 cp --recursive --no-progress /downloads/synthea/ s3://import/
          volumeMounts:
            - name: downloads
              mountPath: /downloads
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 50Mi
              memory: 256Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 256Mi
        - name: bulk-import
          image: "{{ .Values.initJob.curl.image.registry }}/{{ .Values.initJob.curl.image.repository }}:{{ .Values.initJob.curl.image.tag }}"
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Pathling's $import operation is asynchronous-only: kick it off, then poll the status URL until it completes.
              status_url=$(curl --fail --silent --show-error --dump-header - --output /dev/null \
                -X POST \
                --header 'Content-Type: application/json' \
                --header 'Prefer: respond-async' \
                --data @/tmp/config/import-request.json \
                --url ${PATHLING_SERVER_URL}'/fhir/$import' |
                tr -d '\r' | awk 'tolower($1) == "content-location:" { print $2 }')
              echo "Import status URL: ${status_url}"
              [ -n "${status_url}" ] || exit 1
              while true; do
                http_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --url "${status_url}")
                echo "Import status: HTTP ${http_code}"
                if [ "${http_code}" = "200" ]; then
                  break
                elif [ "${http_code}" != "202" ]; then
                  curl --silent --url "${status_url}"
                  exit 1
                fi
                sleep 5
              done
          volumeMounts:
            - name: init-job-config
              mountPath: /tmp/config
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
        - name: wait-for-hive-metastore
          image: "{{ .Values.initJob.wait4x.image.registry }}/{{ .Values.initJob.wait4x.image.repository }}:{{ .Values.initJob.wait4x.image.tag }}"
          args:
            - tcp
            - '{{ printf "%s-%s:%d" .Release.Name "hive-metastore" 9083 }}'
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
      containers:
        - name: lakehousekeeper
          image: "{{ .Values.initJob.fhirToLakehouse.image.registry }}/{{ .Values.initJob.fhirToLakehouse.image.repository }}:{{ .Values.initJob.fhirToLakehouse.image.tag }}"
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          env:
            - name: AWS_ALLOW_HTTP
              value: "1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 /app/src/lakehousekeeper.py register --bucket-name=fhir --database-name-prefix=default/ --hive-metastore=${HIVE_METASTORE_URI}
              python3 /app/src/lakehousekeeper.py optimize --bucket-name=fhir --database-name-prefix=default/
              python3 /app/src/lakehousekeeper.py vacuum   --bucket-name=fhir --database-name-prefix=default/ --retention-hours=0 --dry-run=false --enforce-retention-duration=false
          volumeMounts:
            - name: init-job-config
              mountPath: /app/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            # Spark resolves its dependencies from the Ivy cache baked into the image at /home/nonroot/.ivy2.5.2.
            # Mounting a volume over it hides that cache and forces a download from Maven Central.
            readOnlyRootFilesystem: false
            privileged: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 2000m
              ephemeral-storage: 8Gi
              memory: 4Gi
            requests:
              cpu: 500m
              ephemeral-storage: 8Gi
              memory: 4Gi
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir: {}
        - name: downloads
          emptyDir: {}
        - name: init-job-config
          configMap:
            name: {{ include "common.names.fullname" . }}-init-job-config
