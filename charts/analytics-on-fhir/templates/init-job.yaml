apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "common.names.fullname" . }}-init-job
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.initJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.initJob.activeDeadlineSeconds }}
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-pathling-server
          image: "{{ .Values.initJob.curl.image.registry }}/{{ .Values.initJob.curl.image.repository }}:{{ .Values.initJob.curl.image.tag }}"
          command: ["/bin/sh", "-c"]
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          args:
            - |
              until [ "$(curl -s -o /dev/null -L -w "%{http_code}" "${PATHLING_SERVER_URL}/fhir/metadata")" == "200" ]; do
                  echo "$(date): Waiting for pathling server @ ${PATHLING_SERVER_URL} to be up";
                  sleep 5;
              done;
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
        - name: generate-resources
          image: "{{ .Values.initJob.igBuildTools.image.registry }}/{{ .Values.initJob.igBuildTools.image.repository }}:{{ .Values.initJob.igBuildTools.image.tag }}"
          command: ["/bin/bash", "-c"]
          workingDir: /data
          env:
            - name: HOME
              value: /tmp
            - name: SYNTHEA_SEED
              value: {{ .Values.initJob.synthea.seed | quote }}
            - name: SYNTHEA_REFERENCE_DATE
              value: {{ .Values.initJob.synthea.referenceDate | quote }}
            - name: SYNTHEA_POPULATION
              value: {{ .Values.initJob.synthea.population | quote }}
          args:
            - |
              set -euo pipefail
              synthea() {
                java -jar /usr/local/bin/synthea.jar -s "${SYNTHEA_SEED}" -cs "${SYNTHEA_SEED}" -r "${SYNTHEA_REFERENCE_DATE}" \
                  -p "${SYNTHEA_POPULATION}" -c /tmp/config/synthea.properties "$@"
              }
              # bulk export as NDJSON for the lakehouse
              synthea
              {{- if .Values.initJob.fhirServer.url }}
              # Synthea can only export either NDJSON or transaction bundles per run. Using the same seed and
              # configuration generates the exact same resources with the same ids again, just as transaction
              # bundles for loading into the FHIR server.
              synthea --exporter.fhir.bulk_data=false --exporter.fhir.transaction_bundle=true \
                --exporter.baseDirectory=./synthea-transactions/
              {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: init-job-config
              mountPath: /tmp/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 2000m
              ephemeral-storage: 2Gi
              memory: 1500Mi
            requests:
              cpu: 50m
              ephemeral-storage: 2Gi
              memory: 1500Mi
        {{- if .Values.initJob.fhirServer.url }}
        - name: load-into-fhir-server
          image: "{{ .Values.initJob.igBuildTools.image.registry }}/{{ .Values.initJob.igBuildTools.image.repository }}:{{ .Values.initJob.igBuildTools.image.tag }}"
          command: ["/bin/bash", "-c"]
          workingDir: /data/synthea-transactions/fhir
          env:
            - name: FHIR_SERVER_URL
              value: {{ tpl .Values.initJob.fhirServer.url . | quote }}
          args:
            - |
              set -euo pipefail
              until [ "$(curl -s -o /dev/null -L -w "%{http_code}" "${FHIR_SERVER_URL}/metadata")" = "200" ]; do
                echo "$(date): Waiting for FHIR server @ ${FHIR_SERVER_URL} to be up";
                sleep 5;
              done;
              # the hospital and practitioner bundles go first: the patient bundles reference their resources
              for file in hospitalInformation*.json practitionerInformation*.json *_*.json; do
                echo "Sending ${file}"
                # Synthea creates all resources via POST, which makes the FHIR server assign new ids. Rewrite them
                # to PUTs to keep the generated ids, so the resources match the ones loaded into the lakehouse.
                jq '.entry |= map(.request = {method: "PUT", url: "\(.resource.resourceType)/\(.resource.id)"})' "${file}" |
                  curl -sS --fail-with-body -o /dev/null --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors \
                    -X POST -H "Content-Type: application/fhir+json" --data-binary @- "${FHIR_SERVER_URL}"
              done
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 50Mi
              memory: 256Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 256Mi
        {{- end }}
        - name: upload-resources
          image: "{{ .Values.initJob.awsCli.image.registry }}/{{ .Values.initJob.awsCli.image.repository }}:{{ .Values.initJob.awsCli.image.tag }}"
          command: ["/bin/sh", "-c"]
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          env:
            - name: HOME
              value: /tmp
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-password
          args:
            - |
              aws s3api head-bucket --bucket import 2>/dev/null || aws s3api create-bucket --bucket import
              aws s3 cp --recursive --no-progress /data/synthea/ s3://import/
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 50Mi
              memory: 256Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 256Mi
        - name: bulk-import
          image: "{{ .Values.initJob.curl.image.registry }}/{{ .Values.initJob.curl.image.repository }}:{{ .Values.initJob.curl.image.tag }}"
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Pathling's $import operation is asynchronous-only: kick it off, then poll the status URL until it completes.
              status_url=$(curl --fail --silent --show-error --dump-header - --output /dev/null \
                -X POST \
                --header 'Content-Type: application/json' \
                --header 'Prefer: respond-async' \
                --data @/tmp/config/import-request.json \
                --url ${PATHLING_SERVER_URL}'/fhir/$import' |
                tr -d '\r' | awk 'tolower($1) == "content-location:" { print $2 }')
              echo "Import status URL: ${status_url}"
              [ -n "${status_url}" ] || exit 1
              while true; do
                http_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --url "${status_url}")
                echo "Import status: HTTP ${http_code}"
                if [ "${http_code}" = "200" ]; then
                  break
                elif [ "${http_code}" != "202" ]; then
                  curl --silent --url "${status_url}"
                  exit 1
                fi
                sleep 5
              done
          volumeMounts:
            - name: init-job-config
              mountPath: /tmp/config
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
        - name: wait-for-hive-metastore
          image: "{{ .Values.initJob.wait4x.image.registry }}/{{ .Values.initJob.wait4x.image.repository }}:{{ .Values.initJob.wait4x.image.tag }}"
          args:
            - tcp
            - '{{ printf "%s-%s:%d" .Release.Name "hive-metastore" 9083 }}'
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
      containers:
        - name: lakehousekeeper
          image: "{{ .Values.initJob.fhirToLakehouse.image.registry }}/{{ .Values.initJob.fhirToLakehouse.image.repository }}:{{ .Values.initJob.fhirToLakehouse.image.tag }}"
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          env:
            - name: AWS_ALLOW_HTTP
              value: "1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 /app/src/lakehousekeeper.py register --bucket-name=fhir --database-name-prefix=default/ --hive-metastore=${HIVE_METASTORE_URI}
              python3 /app/src/lakehousekeeper.py optimize --bucket-name=fhir --database-name-prefix=default/
              python3 /app/src/lakehousekeeper.py vacuum   --bucket-name=fhir --database-name-prefix=default/ --retention-hours=0 --dry-run=false --enforce-retention-duration=false
          volumeMounts:
            - name: init-job-config
              mountPath: /app/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            # Spark resolves its dependencies from the Ivy cache baked into the image at /home/nonroot/.ivy2.5.2.
            # Mounting a volume over it hides that cache and forces a download from Maven Central.
            readOnlyRootFilesystem: false
            privileged: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 2000m
              ephemeral-storage: 8Gi
              memory: 4Gi
            requests:
              cpu: 500m
              ephemeral-storage: 8Gi
              memory: 4Gi
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: init-job-config
          configMap:
            name: {{ include "common.names.fullname" . }}-init-job-config
