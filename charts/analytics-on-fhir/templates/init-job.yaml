apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "analytics-on-fhir.fullname" . }}-init-job
  labels:
    {{- include "analytics-on-fhir.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: download-synthea
          image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command: ["/bin/sh", "-c"]
          workingDir: /downloads
          args:
            - |
              curl -fLsSO https://github.com/synthetichealth/synthea/releases/download/master-branch-latest/synthea-with-dependencies.jar
              ls -lsa /downloads
          volumeMounts:
            - name: downloads
              mountPath: /downloads
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 100m
              ephemeral-storage: 2Gi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 2Gi
              memory: 32Mi
        - name: wait-for-pathling-server
          image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command: ["/bin/sh", "-c"]
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          args:
            - |
              until [ "$(curl -s -o /dev/null -L -w "%{http_code}" "${PATHLING_SERVER_URL}/fhir/metadata")" == "200" ]; do
                  echo "$(date): Waiting for pathling server @ ${PATHLING_SERVER_URL} to be up";
                  sleep 5;
              done;
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
        - name: generate-resources
          # might as well use this image since it has java installed
          image: ghcr.io/bzkf/fhir-to-lakehouse:v1.13.16@sha256:6dc63a645b48523eb0696a2aff94072a70274b256b8698e5682765941f287c17
          command: ["/bin/sh", "-c"]
          workingDir: /downloads
          env:
            - name: SYNTHEA_SEED
              value: "20250916"
          args:
            - |
              java -jar /downloads/synthea-with-dependencies.jar -s $SYNTHEA_SEED -cs $SYNTHEA_SEED -r $SYNTHEA_SEED -p 100 -c /tmp/config/synthea.properties
          volumeMounts:
            - name: downloads
              mountPath: /downloads
            - name: init-job-config
              mountPath: /tmp/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            privileged: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 2000m
              ephemeral-storage: 2Gi
              memory: 1500Mi
            requests:
              cpu: 50m
              ephemeral-storage: 2Gi
              memory: 1500Mi
        - name: upload-resources
          image: docker.io/amazon/aws-cli:2.37.9@sha256:92de75724b6a746951f0e8b915d86bbccd7cb55aff96cd0cb4f7017272160780
          command: ["/bin/sh", "-c"]
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          env:
            - name: HOME
              value: /tmp
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-password
          args:
            - |
              aws s3api head-bucket --bucket import 2>/dev/null || aws s3api create-bucket --bucket import
              aws s3 cp --recursive --no-progress /downloads/synthea/ s3://import/
          volumeMounts:
            - name: downloads
              mountPath: /downloads
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 50Mi
              memory: 256Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 256Mi
        - name: bulk-import
          image: docker.io/curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Pathling's $import operation is asynchronous-only: kick it off, then poll the status URL until it completes.
              status_url=$(curl --fail --silent --show-error --dump-header - --output /dev/null \
                -X POST \
                --header 'Content-Type: application/json' \
                --header 'Prefer: respond-async' \
                --data @/tmp/config/import-request.json \
                --url ${PATHLING_SERVER_URL}'/fhir/$import' |
                tr -d '\r' | awk 'tolower($1) == "content-location:" { print $2 }')
              echo "Import status URL: ${status_url}"
              [ -n "${status_url}" ] || exit 1
              while true; do
                http_code=$(curl --silent --output /dev/null --write-out '%{http_code}' --url "${status_url}")
                echo "Import status: HTTP ${http_code}"
                if [ "${http_code}" = "200" ]; then
                  break
                elif [ "${http_code}" != "202" ]; then
                  curl --silent --url "${status_url}"
                  exit 1
                fi
                sleep 5
              done
          volumeMounts:
            - name: init-job-config
              mountPath: /tmp/config
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
        - name: wait-for-hive-metastore
          image: ghcr.io/wait4x/wait4x:3.5.1@sha256:52e6791d4d8b8c80b2106e4d4f1e44ee69477c6dd461bdeb1aae2db6ccd5d038
          args:
            - tcp
            - '{{ printf "%s-%s:%d" .Release.Name "hive-metastore" 9083 }}'
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: 150m
              ephemeral-storage: 50Mi
              memory: 32Mi
            requests:
              cpu: 50m
              ephemeral-storage: 50Mi
              memory: 32Mi
      containers:
        - name: lakehousekeeper
          image: ghcr.io/bzkf/fhir-to-lakehouse:v1.13.16@sha256:6dc63a645b48523eb0696a2aff94072a70274b256b8698e5682765941f287c17
          envFrom:
            - configMapRef:
                name: '{{ printf "%s-%s" .Release.Name "endpoint-config" }}'
          env:
            - name: AWS_ALLOW_HTTP
              value: "1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: '{{ printf "%s-%s" .Release.Name "minio" }}'
                  key: root-password
          command: ["/bin/sh", "-c"]
          args:
            - |
              python3 /app/src/lakehousekeeper.py register --bucket-name=fhir --database-name-prefix=default/ --hive-metastore=${HIVE_METASTORE_URI}
              python3 /app/src/lakehousekeeper.py optimize --bucket-name=fhir --database-name-prefix=default/
              python3 /app/src/lakehousekeeper.py vacuum   --bucket-name=fhir --database-name-prefix=default/ --retention-hours=0 --dry-run=false --enforce-retention-duration=false
          volumeMounts:
            - name: init-job-config
              mountPath: /app/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            privileged: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: 2000m
              ephemeral-storage: 8Gi
              memory: 4Gi
            requests:
              cpu: 500m
              ephemeral-storage: 8Gi
              memory: 4Gi
      restartPolicy: Never
      volumes:
        - name: tmp
          emptyDir: {}
        - name: downloads
          emptyDir: {}
        - name: init-job-config
          configMap:
            name: {{ include "analytics-on-fhir.fullname" . }}-init-job-config
