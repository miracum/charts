apiVersion: v2
name: analytics-on-fhir
description: A Helm chart for deploying a fully-integrated FHIR-based analytics solution.
type: application
home: https://github.com/miracum/charts
keywords:
  - research
  - FHIR
sources:
  - https://github.com/miracum/charts
maintainers:
  - name: miracum
dependencies:
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.2.0
  - name: pathling-server
    version: 0.10.15
    repository: oci://ghcr.io/chgl/charts
  - name: hive-metastore
    repository: oci://ghcr.io/miracum/charts
    version: 0.4.54
  - name: trino
    repository: https://trinodb.github.io/charts
    version: 1.45.0
    condition: trino.enabled
    # - name: superset
    #   repository: https://apache.github.io/superset
    #   version: 0.15.0
deprecated: false
kubeVersion: ">= 1.19.0"
version: 0.1.37
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: security
      description: "the init job now downloads a pinned Synthea release (`initJob.synthea.version`) and verifies its SHA-256 checksum instead of downloading the unpinned `master-branch-latest` build"
    - kind: changed
      description: "the init job's container images are now configurable via `initJob.*.image` and are updated by Renovate"
    - kind: security
      description: "the `generate-resources` and `lakehousekeeper` containers of the init job now use a read-only root filesystem"
    - kind: changed
      description: "use the shared helpers of the `common` chart 0.2.0 for names and labels. The `app.kubernetes.io/name` label of the init job and its ConfigMaps is now the chart name."
