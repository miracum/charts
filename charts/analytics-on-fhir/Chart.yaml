apiVersion: v2
name: analytics-on-fhir
description: A Helm chart for deploying a fully-integrated FHIR-based analytics solution.
type: application
home: https://github.com/miracum/charts
keywords:
  - research
  - FHIR
sources:
  - https://github.com/miracum/charts
maintainers:
  - name: miracum
dependencies:
  - name: pathling-server
    version: 0.10.15
    repository: oci://ghcr.io/chgl/charts
  - name: hive-metastore
    repository: oci://ghcr.io/miracum/charts
    version: 0.4.54
  - name: trino
    repository: https://trinodb.github.io/charts
    version: 1.45.0
    condition: trino.enabled
    # - name: superset
    #   repository: https://apache.github.io/superset
    #   version: 0.15.0
deprecated: false
kubeVersion: ">= 1.19.0"
version: 0.1.36
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: added
      description: "`initJob.backoffLimit` and `initJob.activeDeadlineSeconds` to bound the init job's retries and runtime"
    - kind: changed
      description: "the init job is no longer deleted 100s after it finishes, so the logs of a failed job stay available. Successful jobs are still deleted by the hook delete policy."
    - kind: added
      description: "NOTES.txt"
    - kind: changed
      description: "`kubeVersion` is now `>= 1.23.0-0`. The `-0` suffix allows pre-release-tagged versions such as `v1.30.1-eks-abc` or `v1.30.1-gke.100`, which `>= 1.19.0` did not match."
