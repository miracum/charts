apiVersion: v2
name: analytics-on-fhir
description: A Helm chart for deploying a fully-integrated FHIR-based analytics solution.
type: application
home: https://github.com/miracum/charts
keywords:
  - research
  - FHIR
sources:
  - https://github.com/miracum/charts
maintainers:
  - name: miracum
dependencies:
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.2.0
  - name: pathling-server
    version: 0.10.15
    repository: oci://ghcr.io/chgl/charts
  - name: hive-metastore
    repository: oci://ghcr.io/miracum/charts
    version: 0.6.1
  - name: trino
    repository: https://trinodb.github.io/charts
    version: 1.45.0
    condition: trino.enabled
    # - name: superset
    #   repository: https://apache.github.io/superset
    #   version: 0.15.0
deprecated: false
kubeVersion: ">= 1.19.0"
version: 0.2.0
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |-
    # When using the list of objects option the valid supported kinds are
    # added, changed, deprecated, removed, fixed and security.
    - kind: added
      description: "Optionally load the generated patients into a FHIR server (`initJob.fhirServer.url`), with the same resource ids as in the lakehouse"
    - kind: added
      description: "Made the Synthea seed, reference date, and population configurable (`initJob.synthea.*`)"
    - kind: changed
      description: "Use the Synthea CLI from the ghcr.io/miracum/ig-build-tools image instead of downloading it at runtime. Removed `initJob.synthea.version` and `initJob.synthea.sha256`"
    - kind: changed
      description: "Increased the CPU and memory resources of the init job's Synthea container"
