# -- override the release name
nameOverride: ""

# -- override the full release name
fullnameOverride: ""

opal:
  # -- number of replicas. Should be kept as 1 unless ReadWriteMany persistence is used
  replicaCount: 1

  # @ignored
  image:
    registry: docker.io
    repository: obiba/opal
    tag: 6.2.2@sha256:e8b57dbf3f7182b53ae8ea9913314089bbf5f0a35505fc006b3d7123d34c020f
    pullPolicy: IfNotPresent

  auth:
    administrator:
      # -- the password for the administrator user. If unset and no existing secret is specified, a random one is generated. It is kept across `helm upgrade` by looking up the existing Secret, but `lookup` returns nothing under `helm template` and GitOps tools that render with it (e.g. Argo CD), so a new password is generated on every sync. In that case set this value or use an existing secret.
      # The password is applied on every start of Opal, so changing it changes the actual administrator password.
      password: ""
      existingSecret:
        # -- name of an existing secret that contains the administrator password.
        name: ""
        # -- key inside that existing secret that contains the administrator password
        key: "opal-administrator-password"

  ingress:
    # -- create an Ingress for the application. If `opal.networkPolicy.enabled` is set, the ingress controller must also
    # be allowed via `opal.networkPolicy.extraIngress`.
    enabled: false
    # -- ingressClassName to use
    className: ""
    # -- extra annotations to apply to the Ingress resource
    annotations: {}
    # -- list of ingress hosts
    hosts:
      - host: opal.127.0.0.1.nip.io
        paths:
          - path: /
            pathType: ImplementationSpecific
            portName: http
    # -- TLS configuration
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # -- sets the value for the `JAVA_OPTS` environment variable
  javaOpts: "-XX:+UseG1GC"

  # -- configuration for the server persistence
  persistence:
    # -- enable data persistence using PVC
    enabled: true
    # -- name of an existing PVC to use
    existingClaim: ""
    # -- PVC Storage Class for data volume
    # If defined, storageClassName: <storageClass>
    # If set to "-", storageClassName: "", which disables dynamic provisioning
    # If undefined (the default) or set to null, no storageClassName spec is
    #   set, choosing the default provisioner.
    storageClass: ""
    # -- PVC Access Mode for data volume
    accessModes:
      - ReadWriteOnce
    # -- PVC Storage Request for volume
    size: 8Gi
    # -- annotations for the PVC
    annotations: {}
    # -- labels for the PVC
    labels: {}
    # -- selector to match an existing Persistent Volume (this value is evaluated as a template)
    # selector:
    #   matchLabels:
    #     app: my-app
    selector: {}

  database:
    data:
      # -- database hostname of an external database used to store data. Only used if `postgres.enabled` is set to `false`.
      host: "data.host.example.com"
      # -- port used to connect to the postgres DB
      port: 5432
      # -- name of the database inside. Only used if `postgres.enabled` is `false`, otherwise `postgres.auth.database` is used
      database: "opal_data"
      # -- username used to connect to the DB. Only used if `postgres.enabled` is `false`, otherwise `postgres.auth.username` is used
      username: "opal_data_admin"
      # -- the database password. Only used if `postgres.enabled` is `false`, otherwise the secret created by the postgres chart is used.
      # Must be set when using an external database, unless `existingSecret.name` is set.
      password: ""
      existingSecret:
        # -- name of an existing secret containing the password to the DB.
        name: ""
        # -- name of the key in `database.data.existingSecret.name` to use as the password to the DB.
        key: "data-db-password"
    ids:
      # -- database hostname of an external database used to store ids. Only used if `postgres.enabled` is set to `false`.
      host: "ids.host.example.com"
      # -- port used to connect to the postgres DB
      port: 5432
      # -- name of the database inside. Only used if `postgres.enabled` is `false`, otherwise `postgres.auth.database` is used
      database: "opal_ids"
      # -- username used to connect to the DB. Only used if `postgres.enabled` is `false`, otherwise `postgres.auth.username` is used
      username: "opal_ids_admin"
      # -- the database password. Only used if `postgres.enabled` is `false`, otherwise the secret created by the postgres chart is used.
      # Must be set when using an external database, unless `existingSecret.name` is set.
      password: ""
      existingSecret:
        # -- name of an existing secret containing the password to the DB.
        name: ""
        # -- name of the key in `database.ids.existingSecret.name` to use as the password to the DB.
        key: "ids-db-password"
    config:
      # -- name of the schema in the data database used to store Opal's own configuration (projects, users, permissions,
      # registered databases, ...). Created if it doesn't exist, so the database user needs the `CREATE` privilege
      # on the database. Uses the connection details of `postgres` if enabled, otherwise of `opal.database.data`.
      schema: "opal_config"

  # -- extra environment variables to set on the opal api container
  extraEnv: []

  # -- image pull secrets used by the opal container
  imagePullSecrets: []

  # -- annotations to set on the opal pod
  podAnnotations: {}

  # -- the pod security context
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10041

  # @ignored
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 10041
    runAsGroup: 10041
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  service:
    # -- the type of service
    type: ClusterIP
    # -- the port for the main web interface
    port: 8080
    # -- the port for the TLS-secured interface
    httpsPort: 8443

  # -- set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if primary.resources is set (primary.resources is recommended for production).
  # More information: <https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15>
  resourcesPreset: "small"

  # -- resource limits and requests
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # -- pod node selector
  nodeSelector: {}

  # -- pod tolerations
  tolerations: []

  # -- pod affinity
  affinity: {}

  # -- readiness probe
  # @ignored
  readinessProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 5
    initialDelaySeconds: 30
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 20

  # -- liveness probe
  # @ignored
  livenessProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 5
    initialDelaySeconds: 30
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 30

  serviceAccount:
    # -- Specifies whether a service account should be created.
    create: false
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- whether to automount the SA token.
    automountServiceAccountToken: false

  networkPolicy:
    # -- whether to create a NetworkPolicy for the opal pods
    enabled: true
    # -- add extra ingress rules to the NetworkPolicy. By default, only the Helm test pod may connect to Opal, so when
    # `opal.ingress.enabled` is set, traffic from the ingress controller must be allowed here. Otherwise requests through
    # the Ingress time out. E.g. for ingress-nginx:
    # `[{from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}}], ports: [{port: http}]}]`
    extraIngress: []
    # -- add extra egress rules to the NetworkPolicy
    extraEgress: []

# @ignored
waitForDatabaseInitContainer:
  image:
    registry: docker.io
    repository: library/postgres
    tag: 18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    pullPolicy: IfNotPresent

# -- container security context applied to init containers and the Helm test pods
# @ignored
restrictedContainerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

postgres:
  # -- enabled the included Postgres DB
  # see <https://github.com/CloudPirates-io/helm-charts/tree/main/charts/postgres> for configuration options
  enabled: true
  auth:
    # -- name of the database to create
    database: "opal"
    # -- username for the database user
    username: "opal_admin"
    # -- disable the default postgres user
    enablePostgresUser: false
  # @ignored
  resources: # +doc-gen:ignore
    requests:
      memory: 128Mi
      cpu: 100m
      ephemeral-storage: 50Mi
    limits:
      memory: 192Mi
      cpu: 150m
      ephemeral-storage: 2Gi

rock:
  # -- number of rock instances in the cluster
  replicaCount: 1

  # @ignored
  image:
    registry: docker.io
    repository: datashield/rock-base
    tag: 6.3.5@sha256:eb8833ee050baa995b100b68d9aa358de9c38cfda9c1d1616e0e8884a08fd2bc
    pullPolicy: IfNotPresent

  # Note: the rock pods are stateless. R packages come from the container image and the root filesystem is read-only,
  # so installing additional R packages at runtime (e.g. via the Opal UI) is not possible. To use additional packages,
  # build a custom image based on `datashield/rock-base` and set it via `rock.image`.

  # -- image pull secrets used by the rock pods
  imagePullSecrets: []

  # -- annotations to set on the rock pods
  podAnnotations: {}

  # -- rock cluster name. Evaluated as a template
  clusterName: "default"

  # -- sets the value for the `JAVA_OPTS` environment variable
  javaOpts: "-XX:+UseG1GC"

  auth:
    administrator:
      # -- the user name for the administrator user.
      name: "administrator"
      # -- the password for the administrator user. If unset and no existing secret is specified, a random one is generated. It is kept across `helm upgrade` by looking up the existing Secret, but `lookup` returns nothing under `helm template` and GitOps tools that render with it (e.g. Argo CD), so a new password is generated on every sync. In that case set this value or use an existing secret.
      password: ""
      existingSecret:
        # -- name of an existing secret that contains the administrator password.
        name: ""
        # -- key inside that existing secret that contains the administrator password
        key: "rock-administrator-password"
    manager:
      # -- the user name for the manager user.
      name: "manager"
      # -- the password for the manager user. If unset and no existing secret is specified, a random one is generated. It is kept across `helm upgrade` by looking up the existing Secret, but `lookup` returns nothing under `helm template` and GitOps tools that render with it (e.g. Argo CD), so a new password is generated on every sync. In that case set this value or use an existing secret.
      password: ""
      existingSecret:
        # -- name of an existing secret that contains the manager password.
        name: ""
        # -- key inside that existing secret that contains the manager password
        key: "rock-manager-password"
    user:
      # -- the user name for the user user.
      name: "user"
      # -- the password for the user. If unset and no existing secret is specified, a random one is generated. It is kept across `helm upgrade` by looking up the existing Secret, but `lookup` returns nothing under `helm template` and GitOps tools that render with it (e.g. Argo CD), so a new password is generated on every sync. In that case set this value or use an existing secret.
      password: ""
      existingSecret:
        # -- name of an existing secret that contains the user password.
        name: ""
        # -- key inside that existing secret that contains the user password
        key: "rock-user-password"

  # -- set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if primary.resources is set (primary.resources is recommended for production).
  # More information: <https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15>
  resourcesPreset: "small"

  # -- resource limits and requests
  resources: {}

  serviceAccount:
    # -- Specifies whether a service account should be created.
    create: false
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- whether to automount the SA token.
    automountServiceAccountToken: false

  service:
    # -- the type of service
    type: ClusterIP
    # -- the port for the REST API
    port: 8085

  # @ignored
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    privileged: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 10041
    runAsGroup: 10041
    seccompProfile:
      type: RuntimeDefault

  # -- pod security context
  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10041

  # -- pod node selector
  nodeSelector: {}

  # -- pod tolerations
  tolerations: []

  # -- pod affinity
  affinity: {}

  # -- readiness probe
  # @ignored
  # checks the Rock application, not its R server (`/_check`): Opal stops and starts the R server, e.g. it stops it
  # when Opal shuts down.
  readinessProbe:
    httpGet:
      path: /_info
      port: http
    failureThreshold: 5
    initialDelaySeconds: 30
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 20

  # -- liveness probe
  # @ignored
  livenessProbe:
    httpGet:
      path: /_info
      port: http
    failureThreshold: 5
    initialDelaySeconds: 30
    periodSeconds: 20
    successThreshold: 1
    timeoutSeconds: 30

  networkPolicy:
    # -- whether to create a NetworkPolicy for the rock pods
    enabled: true
    # -- add extra ingress rules to the NetworkPolicy
    extraIngress: []
    # -- Add extra egress rules to the NetworkPolicy
    # If R packages are to be installed, egress to CRAN is needed and needs to be manually added.
    extraEgress: []

