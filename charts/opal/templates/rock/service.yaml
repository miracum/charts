apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-rock
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: rock
spec:
  type: {{ .Values.rock.service.type }}
  ports:
    - port: {{ .Values.rock.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: rock
---
# Governing Service of the rock StatefulSet, giving each pod a stable DNS name which Opal uses to connect.
# Not-ready pods are included: when Opal shuts down, it stops the R server of every rock, making them not ready.
# The new Opal must still be able to reach them to start their R servers again.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "common.names.fullname" . }}-rock-headless
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: rock
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.rock.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: rock
