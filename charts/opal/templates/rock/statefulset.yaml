{{- with  .Values.rock -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name:  {{ include "common.names.fullname" $ }}-rock
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: rock
spec:
  replicas: {{ .replicaCount }}
  serviceName: {{ include "common.names.fullname" $ }}-rock
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" $ | nindent 6 }}
      app.kubernetes.io/component: rock
  template:
    metadata:
      annotations:
        checksum/credentials: {{ include "opal.credentials.checksum" $ | quote }}
        {{- with .podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "common.labels.matchLabels" $ | nindent 8 }}
        app.kubernetes.io/component: rock
    spec:
      {{- with .imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "opal.rock.serviceAccountName" $ }}
      automountServiceAccountToken: {{ .serviceAccount.automountServiceAccountToken }}
      containers:
        - name: rock-log-collector
          image: "{{ $.Values.logCollectorSidecar.image.registry }}/{{ $.Values.logCollectorSidecar.image.repository }}:{{ $.Values.logCollectorSidecar.image.tag }}"
          imagePullPolicy: {{ $.Values.logCollectorSidecar.image.pullPolicy }}
          args: [/bin/sh, -c, "tail -n+1 -F /srv/logs/rock.log"]
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.logCollectorSidecar.resources }}
          resources: {{- toYaml $.Values.logCollectorSidecar.resources | nindent 12 }}
          {{- else if ne $.Values.logCollectorSidecar.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $.Values.logCollectorSidecar.resourcesPreset) | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command: ["true"]
          readinessProbe:
            exec:
              command: ["true"]
          volumeMounts:
            - name: srv
              mountPath: /srv
              readOnly: true
        - name: rserve-log-collector
          image: "{{ $.Values.logCollectorSidecar.image.registry }}/{{ $.Values.logCollectorSidecar.image.repository }}:{{ $.Values.logCollectorSidecar.image.tag }}"
          imagePullPolicy: {{ $.Values.logCollectorSidecar.image.pullPolicy }}
          args: [/bin/sh, -c, "tail -n+1 -F /srv/logs/Rserve.log"]
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.logCollectorSidecar.resources }}
          resources: {{- toYaml $.Values.logCollectorSidecar.resources | nindent 12 }}
          {{- else if ne $.Values.logCollectorSidecar.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $.Values.logCollectorSidecar.resourcesPreset) | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command: ["true"]
          readinessProbe:
            exec:
              command: ["true"]
          volumeMounts:
            - name: srv
              mountPath: /srv
              readOnly: true
        - name: rock
          image: "{{ .image.registry }}/{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          {{- with .livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .resources }}
          resources: {{- toYaml .resources | nindent 12 }}
          {{- else if ne .resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: JAVA_OPTS
              value: {{ .javaOpts | quote }}
            - name: ROCK_CLUSTER
              value: "{{ tpl .clusterName $ }}"
            - name: ROCK_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- range $user := list "administrator" "manager" "user" }}
            {{- $auth := get $.Values.rock.auth $user }}
            - name: ROCK_{{ upper $user }}_NAME
              value: {{ $auth.name | quote }}
            - name: ROCK_{{ upper $user }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "opal.credentials.secretKeyRef" (dict "existingSecret" $auth.existingSecret "key" (printf "rock-%s-password" $user) "context" $) | nindent 18 }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: srv
              mountPath: /srv
      volumes:
        - name: tmp
          emptyDir: {}
        - name: srv
          emptyDir: {}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
