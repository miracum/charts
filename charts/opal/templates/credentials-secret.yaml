{{- /*
A single Secret holding every password the chart manages itself, i.e. those not provided via an existingSecret.
Generated passwords are kept across `helm upgrade` by looking up the existing Secret.
*/ -}}
{{- $entries := include "opal.credentials.entries" . | fromYamlArray -}}
{{- if $entries }}
{{- $secretName := include "opal.credentials.secretName" . -}}
{{- $existingData := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
type: Opaque
data:
  {{- range $entries }}
  {{- if .value }}
  {{ .key }}: {{ .value | b64enc | quote }}
  {{- else if .required }}
  {{ .key }}: {{ required .required "" }}
  {{- else }}
  {{ .key }}: {{ get $existingData .key | default (randAlphaNum 32 | b64enc) | quote }}
  {{- end }}
  {{- end }}
{{- end }}
