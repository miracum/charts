{{- with .Values.opal -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name:  {{ include "common.names.fullname" $ }}-opal
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: opal
spec:
  replicas: {{ .replicaCount }}
  serviceName: {{ include "common.names.fullname" $ }}-opal
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" $ | nindent 6 }}
      app.kubernetes.io/component: opal
  template:
    metadata:
      annotations:
        checksum/credentials: {{ include "opal.credentials.checksum" $ | quote }}
        {{- with .podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "common.labels.matchLabels" $ | nindent 8 }}
        app.kubernetes.io/component: opal
    spec:
      {{- with .imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "opal.opal.serviceAccountName" $ }}
      automountServiceAccountToken: {{ .serviceAccount.automountServiceAccountToken }}
      initContainers:
        - name: wait-for-db
          image: {{ include "opal.waitForDatabaseInitContainerImage" $ }}
          imagePullPolicy: {{ $.Values.waitForDatabaseInitContainer.image.pullPolicy }}
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.initContainers.resources }}
          resources: {{- toYaml $.Values.initContainers.resources | nindent 12 }}
          {{- else if ne $.Values.initContainers.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $.Values.initContainers.resourcesPreset) | nindent 12 }}
          {{- end }}
          {{- $dataDb := dict "db" .database.data "context" $ }}
          {{- $idsDb := dict "db" .database.ids "context" $ }}
          env:
            # all databases Opal connects to, as space-separated host:port pairs
            - name: DB_ENDPOINTS
              value: {{ printf "%s:%s %s:%s" (include "opal.database.host" $dataDb) (include "opal.database.port" $dataDb) (include "opal.database.host" $idsDb) (include "opal.database.port" $idsDb) | quote }}
            # connection to the data database, which also holds the configuration schema
            - name: PGHOST
              value: {{ include "opal.database.host" $dataDb | quote }}
            - name: PGPORT
              value: {{ include "opal.database.port" $dataDb | quote }}
            - name: PGUSER
              value: {{ include "opal.database.user" $dataDb | quote }}
            - name: PGDATABASE
              value: {{ include "opal.database.name" $dataDb | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "opal.database.secretKeyRef" (dict "db" .database.data "key" "data-db-password" "context" $) | nindent 18 }}
            - name: CONFIG_SCHEMA
              value: {{ .database.config.schema | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              for endpoint in ${DB_ENDPOINTS}; do
                until pg_isready -h "${endpoint%:*}" -p "${endpoint##*:}"; do
                  echo "Waiting for DB ${endpoint} to be up";
                  sleep 15;
                done;
              done;
              echo "Creating schema ${CONFIG_SCHEMA} for the Opal configuration database if it doesn't exist"
              echo 'CREATE SCHEMA IF NOT EXISTS :"schema";' | psql -v ON_ERROR_STOP=1 -v schema="${CONFIG_SCHEMA}"
        - name: wait-for-rock
          image: "{{ $.Values.curl.image.registry }}/{{ $.Values.curl.image.repository }}:{{ $.Values.curl.image.tag }}"
          imagePullPolicy: {{ $.Values.curl.image.pullPolicy }}
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.initContainers.resources }}
          resources: {{- toYaml $.Values.initContainers.resources | nindent 12 }}
          {{- else if ne $.Values.initContainers.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $.Values.initContainers.resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: ROCK_HOSTS
              value: {{ include "opal.rock-hosts" $ | quote }}
          command: ["/bin/sh", "-c"]
          # waits for the Rock application on every host. Its R server may be stopped, Opal starts it when needed.
          args:
            - |
              for host in $(echo "${ROCK_HOSTS}" | tr ',' ' '); do
                until curl -fsS -o /dev/null "http://${host}/_info"; do
                  echo "$(date): Waiting for rock @ ${host} to be up";
                  sleep 15;
                done;
              done;
      containers:
        - name: opal-log-collector
          image: "{{ $.Values.logCollectorSidecar.image.registry }}/{{ $.Values.logCollectorSidecar.image.repository }}:{{ $.Values.logCollectorSidecar.image.tag }}"
          imagePullPolicy: {{ $.Values.logCollectorSidecar.image.pullPolicy }}
          args: [/bin/sh, -c, "tail -n+1 -F /srv/logs/opal.log"]
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.logCollectorSidecar.resources }}
          resources: {{- toYaml $.Values.logCollectorSidecar.resources | nindent 12 }}
          {{- else if ne $.Values.logCollectorSidecar.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $.Values.logCollectorSidecar.resourcesPreset) | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command: ["true"]
          readinessProbe:
            exec:
              command: ["true"]
          volumeMounts:
            - name: data
              mountPath: /srv
              readOnly: true
        - name: rest-log-collector
          image: "{{ $.Values.logCollectorSidecar.image.registry }}/{{ $.Values.logCollectorSidecar.image.repository }}:{{ $.Values.logCollectorSidecar.image.tag }}"
          imagePullPolicy: {{ $.Values.logCollectorSidecar.image.pullPolicy }}
          args: [/bin/sh, -c, "tail -n+1 -F /srv/logs/rest.log"]
          {{- with $.Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.logCollectorSidecar.resources }}
          resources: {{- toYaml $.Values.logCollectorSidecar.resources | nindent 12 }}
          {{- else if ne $.Values.logCollectorSidecar.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" $.Values.logCollectorSidecar.resourcesPreset) | nindent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command: ["true"]
          readinessProbe:
            exec:
              command: ["true"]
          volumeMounts:
            - name: data
              mountPath: /srv
              readOnly: true
        - name: opal
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
          image: "{{ .image.registry }}/{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          # The image only applies OPAL_ADMINISTRATOR_PASSWORD on the very first start. Removing its marker file makes it
          # apply the password on every start, so changes to the password are picked up.
          command: ["/bin/bash", "-c"]
          args:
            - rm -f "${OPAL_HOME}/.set_password.done" && exec /docker-entrypoint.sh app
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          startupProbe:
            exec:
              command:
                - test
                - -f
                - /srv/.first_run.done
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 20
          {{- with .livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .resources }}
          resources: {{- toYaml .resources | nindent 12 }}
          {{- else if ne .resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: JAVA_OPTS
              value: "{{ $.Values.opal.javaOpts }}"
            - name: OPAL_ADMINISTRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "opal.credentials.secretKeyRef" (dict "existingSecret" .auth.administrator.existingSecret "key" "opal-administrator-password" "context" $) | nindent 18 }}

            - name: ROCK_HOSTS
              value: {{ include "opal.rock-hosts" $ }}
            {{- range $user := list "administrator" "manager" "user" }}
            {{- $auth := get $.Values.rock.auth $user }}
            - name: ROCK_{{ upper $user }}_USER
              value: {{ $auth.name | quote }}
            - name: ROCK_{{ upper $user }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "opal.credentials.secretKeyRef" (dict "existingSecret" $auth.existingSecret "key" (printf "rock-%s-password" $user) "context" $) | nindent 18 }}
            {{- end }}

            {{- range $db := list "data" "ids" }}
            {{- $cfg := dict "db" (get $.Values.opal.database $db) "context" $ }}
            {{- $prefix := printf "POSTGRES%s" (upper $db) }}
            # DB for {{ $db }}
            - name: {{ $prefix }}_HOST
              value: {{ include "opal.database.host" $cfg | quote }}
            - name: {{ $prefix }}_PORT
              value: {{ include "opal.database.port" $cfg | quote }}
            - name: {{ $prefix }}_USER
              value: {{ include "opal.database.user" $cfg | quote }}
            - name: {{ $prefix }}_DATABASE
              value: {{ include "opal.database.name" $cfg | quote }}
            - name: {{ $prefix }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "opal.database.secretKeyRef" (merge (dict "key" (printf "%s-db-password" $db)) $cfg) | nindent 18 }}
            {{- end }}

            # Opal's own configuration (projects, users, permissions, ...) is stored in a dedicated schema
            # of the data database instead of the embedded H2 database
            - name: POSTGRESCONFIG_HOST
              value: {{ include "opal.database.host" $dataDb | quote }}
            - name: POSTGRESCONFIG_PORT
              value: {{ include "opal.database.port" $dataDb | quote }}
            - name: POSTGRESCONFIG_USER
              value: {{ include "opal.database.user" $dataDb | quote }}
            # the image has no setting for the schema, so it is appended to the database name which ends up in the JDBC URL
            - name: POSTGRESCONFIG_DATABASE
              value: {{ printf "%s?currentSchema=%s" (include "opal.database.name" $dataDb) .database.config.schema | quote }}
            - name: POSTGRESCONFIG_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "opal.database.secretKeyRef" (dict "db" .database.data "key" "data-db-password" "context" $) | nindent 18 }}

            {{- if .ingress.enabled }}
            # CSRF
            - name: CSRF_ALLOWED
              value: {{ include "opal.opal.ingress-hosts" $ | quote }}
            - name: APP_URL
              value: {{ include "opal.opal.public-url" $ | quote }}
            {{- end }}

            {{- if .extraEnv }}
            {{- toYaml .extraEnv | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /srv
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  {{- if and .persistence.enabled .persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ tpl .persistence.existingClaim $ }}
  {{- else if not .persistence.enabled }}
        - name: data
          emptyDir: {}
  {{- else }}
  volumeClaimTemplates:
    - metadata:
        name: data
        {{- with .persistence.annotations  }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .persistence.labels  }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      spec:
        accessModes:
        {{- range .persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .persistence.size | quote }}
        {{- if .persistence.selector }}
        selector: {{- include "common.tplvalues.render" (dict "value" .persistence.selector "context" $) | nindent 10 }}
        {{- end }}
        {{- include "common.storage.class" (dict "persistence" .persistence "global" $.Values.global) | nindent 8 }}
  {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
