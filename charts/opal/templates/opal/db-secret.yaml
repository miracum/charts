{{- $dataSecretNeeded := not .Values.opal.database.data.existingSecret.name -}}
{{- $idsSecretNeeded := not .Values.opal.database.ids.existingSecret.name -}}
{{- if and (not .Values.postgres.enabled) (or $dataSecretNeeded $idsSecretNeeded) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-opal-db-passwords
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: opal
type: Opaque
data:
  {{- if $idsSecretNeeded }}
  ids-db-password: {{ required "opal.database.ids.password or opal.database.ids.existingSecret.name must be set when postgres.enabled=false" .Values.opal.database.ids.password | b64enc | quote }}
  {{- end }}
  {{- if $dataSecretNeeded }}
  data-db-password: {{ required "opal.database.data.password or opal.database.data.existingSecret.name must be set when postgres.enabled=false" .Values.opal.database.data.password | b64enc | quote }}
  {{- end }}
{{- end -}}
