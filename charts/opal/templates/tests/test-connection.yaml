apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "opal.fullname" . }}-test-connection"
  labels:
    {{- include "opal.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-connection
  annotations:
    helm.sh/hook: test
    polaris.fairwinds.com/topologySpreadConstraint-exempt: "true"
    polaris.fairwinds.com/priorityClassNotSet-exempt: "true"
spec:
  restartPolicy: Never
  automountServiceAccountToken: {{ .Values.tests.automountServiceAccountToken }}
  containers:
    {{- $probes := list
      (dict "name" "probe-opal-endpoint" "url" (printf "http://%s-opal:%v/" (include "opal.fullname" .) .Values.opal.service.port))
      (dict "name" "probe-rock-endpoint" "url" (printf "http://%s-rock:%v/_check" (include "opal.fullname" .) .Values.rock.service.port))
    }}
    {{- range $probes }}
    - name: {{ .name }}
      image: "{{ $.Values.curl.image.registry }}/{{ $.Values.curl.image.repository }}:{{ $.Values.curl.image.tag }}"
      command: ["curl"]
      args: ["--fail-with-body", "-vvv", {{ .url | quote }}]
      {{- with $.Values.restrictedContainerSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.tests.resources }}
      resources: {{- toYaml $.Values.tests.resources | nindent 10 }}
      {{- else if ne $.Values.tests.resourcesPreset "none" }}
      resources: {{- include "common.resources.preset" (dict "type" $.Values.tests.resourcesPreset) | nindent 10 }}
      {{- end }}
      livenessProbe:
        exec:
          command: ["true"]
      readinessProbe:
        exec:
          command: ["true"]
    {{- end }}
