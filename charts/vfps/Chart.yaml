apiVersion: v2
name: vfps
description: A Helm chart for deploying VFPS, a very fast and resource-efficient pseudonym service.
type: application
home: https://github.com/miracum/vfps
keywords:
  - grpc
  - pseudonymization
  - research
  - data protection
  - FHIR
sources:
  - https://github.com/miracum/vfps
maintainers:
  - name: miracum
dependencies:
  - name: postgres
    version: 0.19.7
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.1.1
deprecated: false
kubeVersion: ">= 1.19.0"
version: 3.3.0
appVersion: "1.x"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cloudpirates-postgres/postgres
    - url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
  artifacthub.io/screenshots: |
    - title: Screenshot of the OpenAPI/Swagger UI for the REST API
      url: https://raw.githubusercontent.com/miracum/vfps/master/docs/img/openapi.png
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |-
    # When using the list of objects option the valid supported kinds are
    # added, changed, deprecated, removed, fixed and security.
    - kind: fixed
      description: "topologySpreadConstraints is now actually rendered - the template read the value from the wrong scope, so it silently did nothing"
    - kind: fixed
      description: "The appsettings volume is no longer mounted when the appsettings value is empty, where it referenced a ConfigMap that is not created"
    - kind: fixed
      description: "podDisruptionBudget now defaults to maxUnavailable: 1 instead of minAvailable: 1, which was unsatisfiable at replicaCount 1 and blocked node drains"
    - kind: added
      description: "Zero-downtime rollout support: preStop drain hook (Kubernetes 1.30+), terminationGracePeriodSeconds, updateStrategy and minReadySeconds"
    - kind: added
      description: "service.sessionAffinity, required by the Blazor Server admin UI when running more than one replica"
    - kind: added
      description: "extraEnvFrom, so secrets no longer have to be set as plaintext via extraEnv"
    - kind: added
      description: "migrationsJob.backoffLimit, activeDeadlineSeconds and ttlSecondsAfterFinished"
    - kind: added
      description: "Pod annotation checksumming appsettings, so changing it rolls the pods"
    - kind: added
      description: "autoscaling.behavior and priorityClassName"
    - kind: changed
      description: "Maximum Pool Size=50 is now set by default in the connection string, since Npgsql's default of 100 is per replica"
    - kind: changed
      description: "Updated docker.io/curlimages/curl to 8.22.0"
