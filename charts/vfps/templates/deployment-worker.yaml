{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vfps.fullname" . }}-worker
  labels:
    {{- include "vfps.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  annotations:
    polaris.fairwinds.com/automountServiceAccountToken-exempt: "true"
    {{- with .Values.deploymentAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  {{- with .Values.worker.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vfps.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      {{- if or .Values.appsettings .Values.worker.podAnnotations }}
      annotations:
        {{- if .Values.appsettings }}
        checksum/appsettings: {{ include (print $.Template.BasePath "/appsettings-cm.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "vfps.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The same ServiceAccount as the API pods: it is what the wait-for-migrations-job init
      # container's RBAC is bound to, and the workers run that same init container.
      serviceAccountName: {{ include "vfps.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.worker.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # Much longer than the API pods' equivalent, and the reason the workers are a separate
      # Deployment at all: a CSV job that is killed has to be re-dispatched and reprocessed, so it
      # is worth waiting for one to finish - which is not a wait you want on every API pod rollout.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-db
          image: {{ include "vfps.waitForDatabaseInitContainerImage" . }}
          imagePullPolicy: {{ .Values.waitForDatabaseInitContainer.image.pullPolicy }}
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.initContainers.resources }}
          resources: {{- toYaml .Values.initContainers.resources | nindent 12 }}
          {{- else if ne .Values.initContainers.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.initContainers.resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: PGHOST
              value: {{ include "vfps.database.host" $ }}
            - name: PGPORT
              value: {{ include "vfps.database.port" $ | quote }}
            - name: PGUSER
              value: {{ include "vfps.database.user" $ }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready; do
                echo "Waiting for DB ${PGUSER}@${PGHOST}:${PGPORT} to be up";
                sleep 15;
              done;
        {{ if .Values.migrationsJob.enabled }}
        - name: wait-for-migrations-job
          image: ghcr.io/groundnuty/k8s-wait-for:no-root-v2.0@sha256:a26d3d3f6e1c747dd812aba5eef3189d535d0b4e810506bac51f8209a58a0102
          args: ["job", "{{ include "vfps.migrationsJob.resourceName" . }}"]
          {{- with .Values.restrictedContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      containers:
        - name: vfps-worker
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # No gRPC port: nothing routes API traffic here (the Services select
          # app.kubernetes.io/component: api). http is kept for the probes, http-metrics for the
          # ServiceMonitor.
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-metrics
              containerPort: 8082
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .Values.livenessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .Values.readinessProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            {{- include "common.tplvalues.render" (dict "value" (omit .Values.startupProbe "enabled") "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.worker.resources }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- else if ne .Values.worker.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.worker.resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: DOTNET_EnableDiagnostics
              value: "0"
            - name: ConnectionStrings__PostgreSQL
              value: {{ include "vfps.database.connection-string" . }}
            - name: PGUSER
              value: {{ include "vfps.database.user" . }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vfps.database.db-secret-name" . }}
                  key: {{ include "vfps.database.db-secret-key" . }}
            {{- with .Values.gracefulShutdown.shutdownTimeout }}
            - name: ShutdownTimeout
              value: {{ . | quote }}
            {{- end }}
            # This is what makes these pods the workers. Placed before the user-supplied variables
            # so it can still be overridden deliberately, since Kubernetes lets the last occurrence
            # of a duplicated name win.
            - name: CsvProcessing__ProcessJobs
              value: "true"
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
            {{- with .Values.extraEnvDict }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.worker.extraEnv }}
            {{- toYaml .Values.worker.extraEnv | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          {{- if .Values.appsettings }}
            - name: appsettings
              mountPath: /opt/vfps/appsettings.Production.json
              readOnly: true
              subPath: appsettings.Production.json
          {{- end }}
          {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.appsettings }}
        - name: appsettings
          configMap:
            name: {{ include "vfps.fullname" . }}-appsettings
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
