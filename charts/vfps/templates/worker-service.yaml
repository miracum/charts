{{- if and .Values.worker.enabled .Values.serviceMonitor.enabled }}
# Exists purely so the ServiceMonitor has something to select - a ServiceMonitor scrapes the pods
# behind a Service, and the workers are deliberately absent from every other Service in this chart
# (those select app.kubernetes.io/component: api). No API ports are exposed here: nothing should
# route pseudonymization traffic to a worker.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vfps.fullname" . }}-worker-metrics
  labels:
    {{- include "vfps.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.metricsPort }}
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
  selector:
    {{- include "vfps.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
