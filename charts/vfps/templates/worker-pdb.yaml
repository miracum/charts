{{- if and .Values.worker.enabled .Values.worker.podDisruptionBudget.enabled }}
{{- if not (or .Values.worker.podDisruptionBudget.minAvailable .Values.worker.podDisruptionBudget.maxUnavailable) }}
{{- fail "worker.podDisruptionBudget.enabled requires either worker.podDisruptionBudget.minAvailable or worker.podDisruptionBudget.maxUnavailable to be set" }}
{{- end }}
kind: PodDisruptionBudget
apiVersion: policy/v1
metadata:
  name: {{ include "vfps.fullname" . }}-worker
  labels:
    {{- include "vfps.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  # Only one of the two is ever emitted - Kubernetes rejects a PodDisruptionBudget carrying both.
  {{- if .Values.worker.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.worker.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.worker.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vfps.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
