{{- if and .Values.s3.enabled (not .Values.s3.existingSecret) }}
# Credentials belong in a Secret rather than inline in the pod spec, which is what setting them
# through extraEnv used to mean. Prefer s3.existingSecret in production so they never pass through
# the Helm release at all.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vfps.fullname" . }}-s3-secret
  labels:
    {{- include "vfps.labels" . | nindent 4 }}
type: Opaque
data:
  accessKey: {{ .Values.s3.accessKey | b64enc | quote }}
  secretKey: {{ .Values.s3.secretKey | b64enc | quote }}
{{- end }}
