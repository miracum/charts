{{- if and .Values.s3.enabled (not .Values.s3.existingSecret.name) }}
# Credentials belong in a Secret rather than inline in the pod spec, which is what setting them
# through extraEnv used to mean. Prefer s3.existingSecret.name in production so they never pass
# through the Helm release at all - a secret shaped exactly like this one needs no further
# configuration, since s3.existingSecret's key names default to these.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vfps.fullname" . }}-s3-secret
  labels:
    {{- include "vfps.labels" . | nindent 4 }}
type: Opaque
data:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKey | b64enc | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretKey | b64enc | quote }}
{{- end }}
