autoscaling:
  # -- enable horizontal pod autoscaling
  enabled: false
  # -- minReplicas is the lower limit for the number of replicas to which the autoscaler can scale down.
  # It defaults to 1 pod. minReplicas is allowed to be 0 if the alpha feature gate HPAScaleToZero is
  # enabled and at least one Object or External metric is configured.
  # Scaling is active as long as at least one metric value is available.
  minReplicas: 1
  # -- upper limit for the number of pods that can be set by the autoscaler; cannot be smaller than `minReplicas`.
  maxReplicas: 5
  # -- target average CPU utilization (represented as a percentage of requested CPU)
  # over all the pods; if not specified the default autoscaling policy will be used.
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  # -- scaling behavior, e.g. to stabilize scale-down and stop replica counts flapping.
  # See <https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior>
  behavior: {}
  #   scaleDown:
  #     stabilizationWindowSeconds: 300

podDisruptionBudget:
  # -- create a PodDisruptionBudget resource. Only meaningful with `replicaCount` >= 2 - see
  # `maxUnavailable` below.
  enabled: false
  # -- Minimum available instances; ignored if there is no PodDisruptionBudget. Left empty by
  # default in favour of `maxUnavailable`: the previous default of `minAvailable: 1` combined with a
  # single replica is unsatisfiable, so no voluntary eviction could ever succeed and a node drain
  # would hang forever. **Takes precedence over `maxUnavailable` when both are set**, since
  # Kubernetes permits only one.
  minAvailable: ""
  # -- Maximum unavailable instances; ignored if there is no PodDisruptionBudget, or if
  # `minAvailable` is set. `1` keeps a drain possible at any replica count while still preventing
  # all replicas going down at once.
  maxUnavailable: 1

