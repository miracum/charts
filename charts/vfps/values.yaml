# -- number of replicas. Two or more (together with `podDisruptionBudget.enabled`, and ideally
# `topologySpreadConstraints`) is what makes a rolling upgrade or a node drain non-disruptive -
# a single replica means every restart is a gap in service.
replicaCount: 1

# -- deployment update strategy. The default surges a new pod before removing an old one
# (`maxUnavailable: 0`), so capacity never dips below `replicaCount` during an upgrade.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# -- how long a new pod must stay ready before the rollout treats it as available and moves on.
# Guards against a pod that passes its readiness probe and then immediately falls over taking the
# rollout with it.
minReadySeconds: 10

gracefulShutdown:
  # -- how long Kubernetes waits after `SIGTERM` before `SIGKILL`. Must exceed
  # `preStopSleepSeconds` plus `shutdownTimeout`, or the pod is killed mid-drain.
  terminationGracePeriodSeconds: 60
  # -- seconds the pod keeps serving after `SIGTERM` before the application starts draining, so
  # that Service endpoint removal wins its race against the shutdown. Set to `0` to disable the
  # hook. **Requires Kubernetes 1.30+** - it uses the native `sleep` preStop handler, since the
  # vfps runtime image is chiseled and has no shell for an `exec` handler. Silently skipped on
  # older clusters (see the install notes).
  preStopSleepSeconds: 5
  # -- value for the application's own `ShutdownTimeout` setting: how long it waits for in-flight
  # requests, Blazor circuits and background work to finish before tearing down. Keep it below
  # `terminationGracePeriodSeconds` minus `preStopSleepSeconds`. Set to `""` to leave the
  # application default (25s) alone.
  shutdownTimeout: "0.00:00:25"

# @ignored
image:
  registry: ghcr.io
  repository: miracum/vfps
  tag: v1.11.0@sha256:c962bf762bbe1c4119c37da81971c23689fd364642e90fcb3966f85440b51a2b
  pullPolicy: IfNotPresent

migrationsJob:
  # -- whether to enable the database migration job. If enabled, a `ServiceAccount`, `Role`, and `RoleBinding` resources are created
  # which are used by an init container of the main application to wait for the migrations to complete.
  enabled: true
  # -- restart policy for the migration job
  restartPolicy: Never
  # -- how many times the migration job is retried before it's considered failed. More than one
  # attempt matters because a transient failure (a database failover mid-migration) would otherwise
  # fail the job permanently, and the main deployment's init container waits for that job forever.
  backoffLimit: 3
  # -- seconds before the migration job is force-terminated, so a migration blocked on a lock fails
  # loudly instead of hanging an upgrade indefinitely. `0` (the default) means no limit, because a
  # legitimate migration can run for a long time - a `CREATE INDEX CONCURRENTLY` over hundreds of
  # millions of rows can outlast any deadline you'd want to set for the blocked-on-a-lock case.
  activeDeadlineSeconds: 0
  # -- seconds a finished migration job is kept before Kubernetes cleans it up. `-1` (the default)
  # keeps it forever. **Setting a TTL is usually wrong here**: the main deployment's
  # `wait-for-migrations-job` init container waits for this exact job by name, so once it has been
  # cleaned up, any later pod restart or rescheduling on the same chart version blocks in init
  # waiting for a job that no longer exists.
  ttlSecondsAfterFinished: -1
  # -- extra environment variables to set on the migrations job container
  extraEnv: []
  # -- set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if primary.resources is set (primary.resources is recommended for production).
  # More information: <https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15>
  resourcesPreset: "small"
  # -- configure the init containers pods resource requests and limits
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
  serviceAccount:
    # -- Specifies whether a service account should be created
    create: false
    # -- Annotations to add to the service account
    annotations: {}
    # -- The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""
    # -- whether to automount the SA token
    automountServiceAccountToken: false

