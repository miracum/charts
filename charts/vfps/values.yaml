database:
  # -- database hostname of an external database. Only used if `postgres.enabled` is set to `false`.
  host: "host.example.com"
  # -- port used to connect to the postgres DB
  port: 5432
  # -- name of the database inside. If postgres.enabled=true, then postgres.auth.database is used
  database: "vfps"
  # -- username used to connect to the DB. Note that this name is currently used even if postgres.enabled=true
  username: "postgres"
  # -- the database password. Only used if postgres.enabled=false, otherwise the secret created by the postgresql chart is used
  password: "postgres"
  # -- name of an existing secret containing the password to the DB.
  existingSecret: ""
  # -- name of the key in `database.existingSecret` to use as the password to the DB.
  existingSecretKey: "postgresql-postgres-password"
  # -- schema used for the tables. If empty, no `Search Path` is added to the connection string.
  schema: ""
  # -- additional parameters appended to the connection string.
  # `Maximum Pool Size` is set explicitly because Npgsql's own default (100) is **per replica**:
  # scaling to 5 replicas would allow 500 connections against a PostgreSQL whose own
  # `max_connections` commonly defaults to 100, and connection exhaustion looks like a total
  # outage. Budget roughly `replicaCount * (Maximum Pool Size)` plus the CSV job workers, and raise
  # both this and the server's `max_connections` together (or put PgBouncer in front).
  additionalConnectionStringParameters: "Timeout=60;Max Auto Prepare=5;Maximum Pool Size=50;"

