apiVersion: v2
name: blaze
description: A Helm chart for deploying Blaze, a FHIR® Server with internal, fast CQL Evaluation Engine.
type: application
home: https://github.com/samply/blaze
keywords:
  - FHIR
  - CQL
sources:
  - https://github.com/samply/blaze
maintainers:
  - name: miracum
dependencies:
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.2.0
deprecated: false
kubeVersion: ">= 1.23.0-0"
version: 0.8.0
# renovate: datasource=docker depName=ghcr.io/samply/blaze
appVersion: "1.11.0"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: changed
      description: "BREAKING CHANGE: the pod and Service selector label `app.kubernetes.io/name` is now the chart name (e.g. `blaze`) instead of the full release name, like in all other charts. Selectors are immutable, so see the upgrade notes in the README before upgrading."
    - kind: changed
      description: "use the shared helpers of the `common` chart 0.2.0 for names and labels. The chart-specific helper templates (`blaze.fullname`, `blaze.labels`, ...) were removed; custom values that include them (e.g. `baseUrl`) must switch to `common.names.fullname`."
    - kind: changed
      description: "set `appVersion` to the Blaze version (updated by Renovate). It is also used for the `app.kubernetes.io/version` label."
    - kind: fixed
      description: "`frontend.backendURL` is now evaluated as a template. Previously the frontend received the literal, unrendered string."
