apiVersion: v2
name: policies
description: A Helm chart for deploying Kyverno policies verifying images of the github.com/miracum organization.
type: application
home: https://github.com/miracum/charts
keywords:
  - kyverno
sources:
  - https://github.com/miracum/charts
maintainers:
  - name: miracum
deprecated: false
kubeVersion: ">= 1.19.0"
version: 0.10.1
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/kyverno/kyverno
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: fixed
      description: >-
        verify-images-policy now also accepts ".github/workflows/on-release.yaml"
        as the build workflow entrypoint in the SLSA provenance, since
        miracum/util-images images (e.g. hive-metastore v1.4.0) are built from
        that workflow instead of ci.yaml.
    - kind: changed
      description: >-
        re-enabled the curlimages/curl verification policy by default now
        that Kyverno 1.19.0 fixes the admission controller crash tracked at
        https://github.com/kyverno/kyverno/issues/16435.
    - kind: security
      description: >-
        all three image verification policies now also verify images used in
        initContainers and ephemeralContainers - previously only regular
        containers were checked, so an unsigned/unattested image confined to
        an init or ephemeral container silently skipped verification
        entirely.
    - kind: security
      description: >-
        verify-images-policy's matchImageReferences no longer requires a
        ":vX.Y.Z"-style tag: a digest-only image reference (no tag) was
        previously excluded from signature/provenance verification even
        though the exact same image referenced by tag+digest was verified.
