# Default values for policies.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
nameOverride: ""
fullnameOverride: ""

webhookConfiguration:
  timeoutSeconds: 30
failurePolicy: Fail
# -- the Kyverno validation actions to apply. Defaults to Deny, which blocks pods
# using images without a valid signature and SLSA v1 provenance attestation.
# Images built before the `standard-build.yaml` workflow was updated to emit a
# SLSA v1 provenance attestation via actions/attest-build-provenance only carry
# the old, no-longer-verifiable v0.2 attestation and will be rejected; set this
# to `[Audit]` to only report violations while you rebuild them.
validationActions:
  - Deny
