apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: {{ include "policies.fullname" . }}-verify-curl-images
  labels:
    {{- include "policies.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: Verify curl image signatures
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      Verifies the cosign signature of curlimages/curl images using the static
      public key published at https://hub.docker.com/r/curlimages/curl.
spec:
  webhookConfiguration:
    timeoutSeconds: {{ .Values.webhookConfiguration.timeoutSeconds }}
  failurePolicy: {{ .Values.failurePolicy }}
  validationActions:
    {{- toYaml .Values.validationActions | nindent 4 }}
  # background scanning of already-existing pods isn't useful here (their
  # signatures/attestations can't retroactively change), and Kyverno's
  # CEL-based background scanner emits a "Warning"-type "PolicyViolation"
  # event for every scanned resource regardless of pass/fail, which is
  # both noisy and misleading.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    # checks containers, initContainers, and ephemeralContainers: a curl
    # image confined to an init or ephemeral container would otherwise never
    # trigger this policy at all.
    - name: has-curl-image
      expression: >-
        [object.spec.?containers.orValue([]), object.spec.?initContainers.orValue([]), object.spec.?ephemeralContainers.orValue([])]
          .exists(containers, containers.exists(c, c.image.startsWith("docker.io/curlimages/")))
  matchImageReferences:
    - glob: "docker.io/curlimages/*"
  attestors:
    - name: curlKey
      cosign:
        key:
          data: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwFTRXl79xRiAFa5ZX4aZ7Vkdqmji
            5WY0zqc3bd6B08CsNftlYsu2gAqdWm0IlzoQpi2Zi5C437RTg/DgLQ6Bkg==
            -----END PUBLIC KEY-----
  # combines containers, initContainers, and ephemeralContainers: validating
  # images.containers alone would silently skip any curl image confined to an
  # init or ephemeral container.
  variables:
    - name: allImages
      expression: >-
        images.containers + images.initContainers + images.ephemeralContainers
  validations:
    - expression: >-
        variables.allImages.all(img,
          verifyImageSignatures(img, [attestors.curlKey]) > 0
        )
      message: failed to verify curl image signature
