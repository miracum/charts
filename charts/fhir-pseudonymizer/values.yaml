# metadata.annotations to apply to the deployment
deploymentAnnotations: {}

# String to partially override fullname template (will maintain the release name)
nameOverride: ""

# String to fully override fullname template
fullnameOverride: ""

# the type of pseudonymization service to use. One of gPAS, Vfps, None
pseudonymizationService: None

gpas:
  # the gPAS TTP FHIR Pseudonymizer base URL used to be used by the pseudonymization service.
  # it should look similar to this: `http://gpas:8080/ttp-fhir/fhir/`
  fhirUrl: ""
  # Version of gPAS used.
  # There were breaking changes to the FHIR API starting in 1.10.2,
  # so explicitly set this value to 1.10.2 if `gpas.fhirUrl` points to gPAS 1.10.2.
  version: "1.10.1"
  auth:
    basic:
      # whether the fhir-pseudonymizer needs to provide basic auth credentials to access
      # the gPAS FHIR API
      enabled: false
      # HTTP basic auth username
      username: ""
      # HTTP basic auth password
      password: ""
      # read the password from an existing secret from the `GPAS__AUTH__BASIC__PASSWORD` key
      existingSecret: ""
      # name of the key inside the existing secret named above
      existingSecretKey: "GPAS__AUTH__BASIC__PASSWORD"

# container image
image: # +doc-gen:ignore
  registry: ghcr.io
  repository: miracum/fhir-pseudonymizer
  tag: v2.37.3@sha256:a4e8ff154c8aabd9880aa8f81af81b41bf57a5186ba1bf402b5c3dd5dd9787dd
  pullPolicy: IfNotPresent

metrics:
  serviceMonitor:
    # if enabled, creates a ServiceMonitor instance for Prometheus Operator-based monitoring
    enabled: false
    # additional labels for the ServiceMonitor resource, e.g. `release: prometheus`
    additionalLabels: {}
    # namespace: monitoring
    # interval: 30s
    # scrapeTimeout: 10s

auth:
  apiKey:
    # enable requiring an API key placed in the `x-api-key` header to
    # authenticate against the fhir-pseudonymizer's `/fhir/$de-pseudonymize`
    # endpoint.
    enabled: false
    # expected value for the key, aka "password"
    key: ""
    # name of an existing secret with an `APIKEY` key containing the expected password
    existingSecret: ""

# number of replicas. This components can also be easily scaled horizontally if necessary.
replicaCount: 1

# image pull secrets
imagePullSecrets: []

# pod annotations
podAnnotations: {}

# the pod security context
podSecurityContext: {}
  # fsGroup: 2000

# the container security context
securityContext: # +doc-gen:ignore
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# service to expose the fhir-pseudonymizer at
service: # +doc-gen:break
  type: ClusterIP
  port: 8080
  # port to expose metrics at under the `/metrics` path
  metricsPort: 8081

# configure the anonymization rules, see <https://github.com/miracum/fhir-pseudonymizer/blob/HEAD/src/FhirPseudonymizer/anonymization.yaml> for an example.
# this is evaluated as a template. Also see [README.md](README.md#pseudonymization) for configuring it within this values.yaml
anonymizationConfig: ""

# set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if primary.resources is set (primary.resources is recommended for production).
# More information: <https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15>
resourcesPreset: "small"

# configure the resource requests and limits
resources: {}
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

ingress:
  # create an Ingress for the application
  enabled: false
  # ingressClassName to use
  className: ""
  # extra annotations to apply to the Ingress resource
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # list of ingress hosts
  hosts:
    - host: fhir-pseudonymizer.127.0.0.1.nip.io
      paths:
        - path: /
          pathType: ImplementationSpecific
          portName: http
  # TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# node labels for pods assignment
# see: <<https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/>>
nodeSelector: {}

# tolerations for pods assignment
# see: <https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/>
tolerations: []

# affinity for pods assignment
# see: <https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity>
affinity: {}

# readiness probe
readinessProbe: # +doc-gen:ignore
  enabled: true
  httpGet:
    path: /ready
    port: http
  failureThreshold: 3
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# liveness probe
livenessProbe: # +doc-gen:ignore
  enabled: true
  httpGet:
    path: /live
    port: http
  failureThreshold: 3
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# startup probe
startupProbe: # +doc-gen:ignore
  enabled: false
  httpGet:
    path: /ready
    port: http
  failureThreshold: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# extra environment variables to apply to the container
extraEnv: []
# - name: UseSystemTextJsonFhirSerializer
#   value: "true"

# extra volumeMounts for the main fhir-pseudonymizer container
extraVolumeMounts: []

# extra volumes
extraVolumes: []

# pod topology spread configuration
# see: <https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/#api>
topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: fhir-pseudonymizer
  #       app.kubernetes.io/instance: fhir-pseudonymizer

podDisruptionBudget:
  # create a PodDisruptionBudget resource
  enabled: false
  # Minimum available instances; ignored if there is no PodDisruptionBudget
  minAvailable: 1
  # Maximum unavailable instances; ignored if there is no PodDisruptionBudget
  maxUnavailable: ""

autoscaling:
  # enable horizontal pod autoscaling
  enabled: false
  # minReplicas is the lower limit for the number of replicas to which the autoscaler can scale down.
  # It defaults to 1 pod. minReplicas is allowed to be 0 if the alpha feature gate HPAScaleToZero is
  # enabled and at least one Object or External metric is configured.
  # Scaling is active as long as at least one metric value is available.
  minReplicas: 1
  # upper limit for the number of pods that can be set by the autoscaler; cannot be smaller than `minReplicas`.
  maxReplicas: 5
  # target average CPU utilization (represented as a percentage of requested CPU)
  # over all the pods; if not specified the default autoscaling policy will be used.
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
  # whether to automount the SA token
  automountServiceAccountToken: false

# @ignored
curl: # +doc-gen:ignore
  image:
    registry: docker.io
    repository: curlimages/curl
    tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777

# container security context applied to init containers and the Helm test pods
restrictedContainerSecurityContext: # +doc-gen:ignore
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

vfps:
  # set to `true` to enable the included vfps sub-chart and auto-configure the FHIR Pseudonymizer
  # to use it as the pseudonymization backend
  enabled: false

  service: # +doc-gen:ignore
    grpcPort: 8081

externalVfps:
  # the address of an external vfps service to use.
  # Use `dns:///example:8081` to enable dns-based round-robin client-side load-balancing.
  address: ""

# configure reading FHIR resources directly from Kafka, in addition to the HTTP API.
# See <https://github.com/miracum/fhir-pseudonymizer#reading-directly-from-kafka> and
# [README.md](README.md#reading-from-kafka) for details.
kafka:
  # master switch for all Kafka integration: consuming from `kafka.topics` and publishing
  # provenance bundles to `kafka.provenanceTopic`. Requires `kafka.bootstrapServers` to be set.
  enabled: false
  # comma-separated list of `host:port` Kafka brokers to bootstrap from, e.g. `kafka:9092`
  bootstrapServers: ""
  # list of input topics to consume FHIR resources/bundles from, e.g. `["fhir.patient", "fhir.observation"]`.
  # Each entry is evaluated as a template. Left empty, nothing is consumed from Kafka and only
  # provenance for resources pseudonymized via the REST API is published, if `kafka.provenanceTopic` is set.
  topics: []
  # regular expression matched against each input topic's name to derive the output topic the
  # pseudonymized resource is written to. Together with `kafka.outputTopicReplacement`, the
  # default prepends `pseudonymized.` to every input topic, turning `fhir.test` into
  # `pseudonymized.fhir.test`.
  outputTopicPattern: "^"
  # the string every match of `kafka.outputTopicPattern` is replaced with
  outputTopicReplacement: "pseudonymized."
  # if set, a Bundle containing a FHIR Provenance resource documenting the pseudonymization is
  # published to this topic for every successfully pseudonymized resource - including those
  # pseudonymized via the REST API. Evaluated as a template.
  provenanceTopic: ""
  # the number of workers anonymizing messages concurrently. Left empty, this defaults to the
  # number of CPU cores visible to the container.
  workerCount: ""
  # the maximum number of messages buffered per worker before the consumer pauses fetching
  # new ones (backpressure). Left empty, this defaults to 100.
  workerChannelCapacity: ""
  # settings shared by the consumer and the producer, set as `Kafka__Client__<key>` environment
  # variables. Any property of `Confluent.Kafka.ClientConfig` can be set here, e.g.
  # `securityProtocol: SaslSsl`, `saslMechanism: ScramSha512`, or `saslUsername: fhir-pseudonymizer`.
  # Set the brokers via `kafka.bootstrapServers` instead of here. Since these end up in the pod
  # spec in plaintext, set credentials via `extraEnv` with a `secretKeyRef` instead.
  client: {}
  consumer:
    # the Kafka consumer group id. Evaluated as a template. Note that it is also part of the name
    # of the dead letter topic failed messages are sent to: `error.<input-topic>.<group-id>`.
    groupId: '{{ include "fhir-pseudonymizer.fullname" . }}'
    # consumer-only settings layered on top of `kafka.client`, set as `Kafka__Consumer__<key>`
    # environment variables. Any property of `Confluent.Kafka.ConsumerConfig` can be set here,
    # e.g. `sessionTimeoutMs: "45000"`.
    config: {}
  producer:
    # producer-only settings layered on top of `kafka.client`, set as `Kafka__Producer__<key>`
    # environment variables. Any property of `Confluent.Kafka.ProducerConfig` can be set here,
    # e.g. `lingerMs: "100"`.
    config: {}

tests:
  automountServiceAccountToken: false
  # set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if primary.resources is set (primary.resources is recommended for production).
  # More information: <https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15>
  resourcesPreset: "nano"
  # configure the test pods resource requests and limits
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
