{{- if and (not .Values.postgres.enabled) (not .Values.database.existingSecret.name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hive-metastore.fullname" . }}-db-password
  labels:
    {{- include "hive-metastore.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ (required "database.password or database.existingSecret.name must be set when postgres.enabled=false" .Values.database.password) | b64enc | quote }}
{{- end -}}
