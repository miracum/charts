apiVersion: v2
name: hive-metastore
description: A Helm chart for deploying the Hive Metastore
type: application
sources:
  - https://github.com/apache/hive
home: https://hive.apache.org/
maintainers:
  - name: miracum
dependencies:
  - name: postgres
    version: 0.21.2
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.2.0
kubeVersion: ">= 1.23.0-0"
version: 0.6.0
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cloudpirates-postgres/postgres
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: security
      description: "the config ConfigMap is mounted with mode `0555` instead of `0777` and `hive-site.tmpl.xml` is mounted read-only"
    - kind: security
      description: "BREAKING CHANGE: `database.password` no longer defaults to `postgres`. It must be set (or `database.existingSecret.name` be used) when `postgres.enabled=false`; the chart fails to render otherwise. The password Secret is no longer created when `postgres.enabled=true`."
    - kind: fixed
      description: "the Helm test pod no longer carries the selector labels of the Deployment and Service, so it can't receive traffic or be adopted"
    - kind: changed
      description: "use the shared helpers of the `common` chart 0.2.0 for names and labels. The chart-specific helper templates (`hive-metastore.fullname`, ...) were removed."
