apiVersion: v2
name: hive-metastore
description: A Helm chart for deploying the Hive Metastore
type: application
sources:
  - https://github.com/apache/hive
home: https://hive.apache.org/
dependencies:
  - name: postgres
    version: 0.21.2
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.1.1
version: 0.5.1
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/cloudpirates-postgres/postgres
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: changed
      description: "the pod template now only carries the stable selector labels. Previously `helm.sh/chart` and `app.kubernetes.io/version` changed with every chart release and rolled the pods unnecessarily. This causes a one-time restart on upgrade."
    - kind: added
      description: "set resource requests/limits on the `wait-for-db` init container (`initContainers.resourcesPreset`/`initContainers.resources`), so pods are admitted in namespaces with a ResourceQuota"
    - kind: added
      description: "optional PodDisruptionBudget (`podDisruptionBudget.*`), disabled by default"
    - kind: changed
      description: "roll the pod when the database password Secret changes"
