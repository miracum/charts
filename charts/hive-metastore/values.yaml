# -- This will set the replicaset count more information can be found here: <https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/>
replicaCount: 1

# This sets the container image more information can be found here: <https://kubernetes.io/docs/concepts/containers/images/>
# @ignored
image:
  registry: ghcr.io
  repository: miracum/util-images/hive-metastore
  tag: v1.4.3@sha256:91f6a16a2d80911f5cf1e411bb36590df763269f3ff1efbff4f811eb63d56483
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent

# This is for the secrets for pulling an image from a private repository more information can be found here: <https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/>
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: <https://kubernetes.io/docs/concepts/security/service-accounts/>
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials. Used in ServiceAccount.automountServiceAccountToken
  # and in Deployment.spec.template.spec.automountServiceAccountToken even if serviceAccount.create=false.
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: <https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/>
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: <https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/>
podLabels: {}

# @ignored
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"

# @ignored
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: false

# This is for setting up a service more information can be found here: <https://kubernetes.io/docs/concepts/services-networking/service/>
service:
  # This sets the service type more information can be found here: <https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types>
  type: ClusterIP
  # This sets the ports more information can be found here: <https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports>
  port: 9083

# set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if .resources is set (.resources is recommended for production).
# More information: <https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15>
resourcesPreset: "small"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: <https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/>
# @ignored
livenessProbe:
  tcpSocket:
    port: 9083
  failureThreshold: 3
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# @ignored
readinessProbe:
  tcpSocket:
    port: 9083
  failureThreshold: 3
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# @ignored
startupProbe:
  tcpSocket:
    port: 9083
  failureThreshold: 5
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

podDisruptionBudget:
  # -- create a PodDisruptionBudget for the Hive Metastore. Only useful when running more than one replica.
  enabled: false
  # -- minimum number of pods that must remain available. Takes precedence over `maxUnavailable` if set.
  minAvailable: ""
  # -- maximum number of pods that can be unavailable
  maxUnavailable: 1

# This section is for setting up autoscaling more information can be found here: <https://kubernetes.io/docs/concepts/workloads/autoscaling/>
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# -- extra environment variables to apply to the container
extraEnv: []

# -- a hive-site.xml template to use for the Hive Metastore config. It's processed by envsubst first.
# Evaluated as a helm template, so you can use other values from this chart.
hiveSiteXmlTemplate: |
  <?xml version="1.0"?>
  <configuration>
      <property>
          <name>hive.metastore.warehouse.dir</name>
          <value>file:///tmp/warehouse</value>
      </property>
      <property>
          <name>javax.jdo.option.ConnectionURL</name>
          <value>jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}</value>
      </property>
      <property>
          <name>javax.jdo.option.ConnectionUserName</name>
          <value>${PGUSER}</value>
      </property>
      <property>
          <name>javax.jdo.option.ConnectionPassword</name>
          <value>${PGPASSWORD}</value>
      </property>
      <property>
          <name>javax.jdo.option.ConnectionDriverName</name>
          <value>org.postgresql.Driver</value>
      </property>
      <property>
          <name>metastore.storage.schema.reader.impl</name>
          <value>org.apache.hadoop.hive.metastore.SerDeStorageSchemaReader</value>
      </property>
      <property>
          <name>hive.security.authorization.createtable.owner.grants</name>
          <value>ALL</value>
      </property>
      <property>
          <name>hive.security.metastore.authorization.auth.reads</name>
          <value>true</value>
      </property>
      <property>
          <name>hive.users.in.admin.role</name>
          <value>admin</value>
      </property>
      <property>
          <name>hive.input.format</name>
          <value>io.delta.hive.HiveInputFormat</value>
      </property>
      <property>
          <name>hive.tez.input.format</name>
          <value>io.delta.hive.HiveInputFormat</value>
      </property>
  </configuration>

# -- container security context applied to init containers and the Helm test pods
# @ignored
restrictedContainerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# @ignored
tests:
  image:
    registry: docker.io
    repository: library/busybox
    tag: 1.38.0-uclibc@sha256:2931107fe4c9a8fae3f3fc5ee7052943c1df7282e83cd001d82bb15313ee8a98
    pullPolicy: IfNotPresent
  automountServiceAccountToken: false
  # set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if primary.resources is set (primary.resources is recommended for production).
  # More information: <https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15>
  resourcesPreset: "nano"
  # configure the test pods resource requests and limits
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

database:
  # -- database hostname of an external database. Only used if `postgres.enabled` is set to `false`.
  host: "host.example.com"
  # -- port used to connect to the postgres DB
  port: 5432
  # -- name of the database inside. Only used if `postgres.enabled` is `false`, otherwise `postgres.auth.database` is used
  database: "hive_metastore"
  # -- username used to connect to the DB. Only used if `postgres.enabled` is `false`, otherwise `postgres.auth.username` is used
  username: "postgres"
  # -- the database password. Only used if `postgres.enabled` is `false`, otherwise the secret created by the postgres chart is used.
  # Must be set when using an external database, unless `database.existingSecret.name` is set.
  password: ""
  existingSecret:
    # -- name of an existing secret containing the password to the DB.
    name: ""
    # -- name of the key in the existing secret to use as the password to the DB.
    key: "postgresql-postgres-password"
  # -- schema used for the tables.
  schema: "hive"

postgres:
  # -- enabled the included Postgres DB
  # see <https://github.com/CloudPirates-io/helm-charts/tree/main/charts/postgres> for configuration options
  enabled: true
  auth:
    # -- name of the database to create
    database: "hive_metastore"
    # -- username for the database user
    username: "hive_metastore_admin"
    # -- disable the default postgres user
    enablePostgresUser: false
  # @ignored
  resources: # +doc-gen:ignore
    requests:
      memory: 128Mi
      cpu: 100m
      ephemeral-storage: 50Mi
    limits:
      memory: 192Mi
      cpu: 150m
      ephemeral-storage: 2Gi

initContainers:
  # -- set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if `initContainers.resources` is set (`initContainers.resources` is recommended for production).
  # More information: <https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15>
  resourcesPreset: "nano"
  # -- configure the init containers' resource requests and limits manually
  resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# @ignored
waitForDatabaseInitContainer:
  image:
    registry: docker.io
    repository: library/postgres
    tag: 18.6@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
    pullPolicy: IfNotPresent
