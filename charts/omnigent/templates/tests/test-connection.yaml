apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "common.names.fullname" . }}-test-connection"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: test-connection
    {{- if and .Values.networkPolicy.enabled (not .Values.networkPolicy.allowExternal) }}
    {{ include "common.names.fullname" . }}-client: "true"
    {{- end }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: {{ .Values.tests.automountServiceAccountToken }}
  containers:
    {{- $baseUrl := printf "http://%s:%v" (include "common.names.fullname" .) .Values.service.port }}
    {{- $probes := list
      (dict "name" "probe-health-endpoint" "url" (printf "%s/health" $baseUrl))
      (dict "name" "probe-web-ui" "url" (printf "%s/" $baseUrl))
    }}
    {{- range $probes }}
    - name: {{ .name }}
      image: "{{ $.Values.curl.image.registry }}/{{ $.Values.curl.image.repository }}:{{ $.Values.curl.image.tag }}"
      command: ["curl", "-vvv", "--fail-with-body", "--retry", "5", "--retry-connrefused", "--retry-delay", "5"]
      args: [{{ .url | quote }}]
      {{- with $.Values.restrictedContainerSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.tests.resources }}
      resources: {{- toYaml $.Values.tests.resources | nindent 8 }}
      {{- else if ne $.Values.tests.resourcesPreset "none" }}
      resources: {{- include "common.resources.preset" (dict "type" $.Values.tests.resourcesPreset) | nindent 8 }}
      {{- end }}
      livenessProbe:
        exec:
          command: ["true"]
      readinessProbe:
        exec:
          command: ["true"]
    {{- end }}
