{{- if eq (include "omnigent.sandbox.rbacEnabled" .) "true" }}
{{- $namespace := include "omnigent.sandbox.namespace" . }}
{{- if and .Values.sandbox.namespace.create (ne $namespace .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: runner
    # the runner pods created by the server comply with the restricted Pod Security Standard
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
---
{{- end }}
# the runner pods don't need access to the Kubernetes API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "omnigent.sandbox.serviceAccountName" . }}
  namespace: {{ $namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: runner
automountServiceAccountToken: false
---
# the permissions the server needs to manage runners. Withholds `secrets/get` and `pods/exec`.
# Via <https://github.com/omnigent-ai/omnigent/blob/main/deploy/kubernetes/overlays/sandbox-runners/role.yaml>
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "common.names.fullname" . }}-sandbox-manager
  namespace: {{ $namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  # `provider: kubernetes` runs each sandbox as a Job
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  # `provider: agent_sandbox` runs each sandbox as an agent-sandbox `Sandbox`
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "list", "get", "delete"]
  # only used to show why a runner failed to start
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # each runner gets its launch token via a per-runner secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "common.names.fullname" . }}-sandbox-manager
  namespace: {{ $namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "common.names.fullname" . }}-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "omnigent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
