{{- if and (not .Values.postgres.enabled) (not .Values.database.existingSecret.name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.names.fullname" . }}-db-password
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  postgres-password: {{ (required "database.password or database.existingSecret.name must be set when postgres.enabled=false" .Values.database.password) | b64enc | quote }}
{{- end -}}
