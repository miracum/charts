apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "common.names.fullname" . }}-test-connection"
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    polaris.fairwinds.com/topologySpreadConstraint-exempt: "true"
    polaris.fairwinds.com/priorityClassNotSet-exempt: "true"
spec:
  restartPolicy: Never
  automountServiceAccountToken: {{ .Values.tests.automountServiceAccountToken }}
  containers:
    {{- $probes := list
      (dict "name" "test-fhir-gateway" "url" (printf "%s-gateway:%v/actuator/health" (include "common.names.fullname" .) .Values.service.metricsPort))
    }}
    {{- if .Values.loincConverter.enabled }}
    {{- $probes = append $probes (dict "name" "test-loinc-conversion" "url" (printf "%s-loinc-converter:%v/ready" (include "common.names.fullname" .) .Values.loincConverter.service.port)) }}
    {{- end }}
    {{- range $probes }}
    - name: {{ .name }}
      image: "{{ $.Values.curl.image.registry }}/{{ $.Values.curl.image.repository }}:{{ $.Values.curl.image.tag }}"
      imagePullPolicy: IfNotPresent
      command: ["curl", "--fail-with-body"]
      args: [{{ .url | quote }}]
      {{- with $.Values.restrictedContainerSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.tests.resources }}
      resources: {{- toYaml $.Values.tests.resources | nindent 10 }}
      {{- else if ne $.Values.tests.resourcesPreset "none" }}
      resources: {{- include "common.resources.preset" (dict "type" $.Values.tests.resourcesPreset) | nindent 10 }}
      {{- end }}
      livenessProbe:
        exec:
          command: ["true"]
      readinessProbe:
        exec:
          command: ["true"]
    {{- end }}
