{{- if and .Values.kafka.enabled .Values.kafka.strimziClusterName (eq .Values.kafka.securityProtocol "SSL") }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ include "common.names.fullname" . }}-kafka-user
  labels:
    strimzi.io/cluster: {{ .Values.kafka.strimziClusterName }}
spec:
  authentication:
    type: tls
{{- end }}
