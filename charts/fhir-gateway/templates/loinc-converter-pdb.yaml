{{- if and .Values.loincConverter.enabled .Values.loincConverter.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "common.names.fullname" . }}-loinc-converter
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: loinc-converter
spec:
  {{- if .Values.loincConverter.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.loincConverter.podDisruptionBudget.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.loincConverter.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: loinc-converter
{{- end }}
