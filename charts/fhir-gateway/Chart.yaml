apiVersion: v2
name: fhir-gateway
description: A Helm chart for deploying the MIRACUM FHIR Gateway
type: application
sources:
  - https://github.com/miracum/fhir-gateway
home: https://github.com/miracum/fhir-gateway
maintainers:
  - name: miracum
dependencies:
  - name: postgres
    version: 0.21.2
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: fhir-pseudonymizer
    condition: fhir-pseudonymizer.enabled
    version: 0.10.24
    repository: oci://ghcr.io/miracum/charts
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.2.0
kubeVersion: ">= 1.23.0-0"
version: 12.0.47
# renovate: datasource=docker depName=ghcr.io/miracum/fhir-gateway extractVersion=^v(?<version>.+)$
appVersion: "6.1.9"
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: changed
      description: "use the shared helpers of the `common` chart 0.2.0 for names and labels. The chart-specific helper templates (`fhir-gateway.fullname`, ...) were removed; custom values that include them must switch to `common.names.fullname`."
    - kind: changed
      description: "set `appVersion` to the FHIR Gateway version (updated by Renovate)"
