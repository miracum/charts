apiVersion: v2
name: fhir-gateway
description: A Helm chart for deploying the MIRACUM FHIR Gateway
type: application
sources:
  - https://github.com/miracum/fhir-gateway
home: https://github.com/miracum/fhir-gateway
dependencies:
  - name: postgres
    version: 0.21.2
    repository: oci://registry-1.docker.io/cloudpirates
    condition: postgres.enabled
  - name: fhir-pseudonymizer
    condition: fhir-pseudonymizer.enabled
    version: 0.10.24
    repository: oci://ghcr.io/miracum/charts
  - name: common
    repository: oci://ghcr.io/miracum/charts
    version: 0.1.1
version: 12.0.46
annotations:
  # When using the list of objects option the valid supported kinds are
  # added, changed, deprecated, removed, fixed and security.
  artifacthub.io/changes: |
    - kind: fixed
      description: "fix invalid YAML being rendered when `sinks.fhirServer.enabled=true`"
    - kind: added
      description: "optional PodDisruptionBudgets for the gateway (`podDisruptionBudget.*`) and the LOINC converter (`loincConverter.podDisruptionBudget.*`), disabled by default"
    - kind: added
      description: "`startupProbe` for the gateway so the liveness/readiness probes don't need to wait out the slow Spring Boot startup"
    - kind: changed
      description: "roll the gateway's pod when the chart-managed external Postgres password Secret changes"
