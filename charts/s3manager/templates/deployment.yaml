{{- include "s3manager.validateInstances" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        {{- if include "s3manager.hasInlineKeyPairs" . }}
        checksum/credentials: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "common.labels.matchLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "s3manager.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      containers:
        - name: s3manager
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else if ne .Values.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          env:
            - name: PORT
              value: "8080"
            - name: ALLOW_DELETE
              value: {{ .Values.allowDelete | quote }}
            - name: LIST_RECURSIVE
              value: {{ .Values.listRecursive | quote }}
            - name: SHOW_VERSIONS
              value: {{ .Values.showVersions | quote }}
            - name: SHOW_METADATA
              value: {{ .Values.showMetadata | quote }}
            - name: TIMEOUT
              value: {{ .Values.timeout | quote }}
            {{- with .Values.timezone }}
            - name: TZ
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bucketNames }}
            - name: BUCKET_NAME
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.rootUrl }}
            - name: ROOT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serverSideEncryption.type }}
            - name: SSE_TYPE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.serverSideEncryption.existingSecret.name }}
            - name: SSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.serverSideEncryption.existingSecret.key }}
            {{- end }}
            {{- range $index, $instance := .Values.instances }}
            {{- $prefix := printf "S3_%d_" (add1 $index) }}
            {{- $obcName := include "s3manager.instance.obcName" $instance }}
            - name: {{ $prefix }}NAME
              value: {{ include "s3manager.instance.name" $instance | quote }}
            {{- if $obcName }}
            {{- $obc := $instance.objectBucketClaim }}
            {{- $obcConfigMap := default $obcName $obc.configMapName }}
            # the ConfigMap created for the ObjectBucketClaim. Assembled into the S3 Manager settings below via dependent environment variables.
            - name: {{ $prefix }}OBC_BUCKET_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ $obcConfigMap }}
                  key: BUCKET_HOST
            - name: {{ $prefix }}OBC_BUCKET_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ $obcConfigMap }}
                  key: BUCKET_PORT
            - name: {{ $prefix }}OBC_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ $obcConfigMap }}
                  key: BUCKET_NAME
            - name: {{ $prefix }}ENDPOINT
              value: {{ printf "$(%sOBC_BUCKET_HOST):$(%sOBC_BUCKET_PORT)" $prefix $prefix | quote }}
            # the bucket is listed explicitly, since the ObjectBucketClaim's user may not be allowed to list buckets
            - name: {{ $prefix }}BUCKETS
              value: {{ prepend ($instance.buckets | default list) (printf "$(%sOBC_BUCKET_NAME)" $prefix) | join "," | quote }}
            {{- if $instance.region }}
            - name: {{ $prefix }}REGION
              value: {{ $instance.region | quote }}
            {{- else }}
            - name: {{ $prefix }}REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ $obcConfigMap }}
                  key: BUCKET_REGION
                  optional: true
            {{- end }}
            # in-cluster ObjectBucketClaim endpoints (e.g. the Rook Ceph RGW service) usually serve plain HTTP
            - name: {{ $prefix }}USE_SSL
              value: {{ ternary $instance.useSSL false (hasKey $instance "useSSL") | quote }}
            {{- else }}
            {{- with $instance.endpoint }}
            - name: {{ $prefix }}ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with $instance.region }}
            - name: {{ $prefix }}REGION
              value: {{ . | quote }}
            {{- end }}
            {{- if hasKey $instance "useSSL" }}
            - name: {{ $prefix }}USE_SSL
              value: {{ $instance.useSSL | quote }}
            {{- end }}
            {{- with $instance.buckets }}
            - name: {{ $prefix }}BUCKETS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- if $instance.skipSSLVerification }}
            - name: {{ $prefix }}SKIP_SSL_VERIFICATION
              value: "true"
            {{- end }}
            {{- with $instance.signatureType }}
            - name: {{ $prefix }}SIGNATURE_TYPE
              value: {{ . | quote }}
            {{- end }}
            {{- with $instance.bucketLookup }}
            - name: {{ $prefix }}BUCKET_LOOKUP
              value: {{ . | quote }}
            {{- end }}
            {{- if $instance.useIam }}
            - name: {{ $prefix }}USE_IAM
              value: "true"
            {{- end }}
            {{- with $instance.iamEndpoint }}
            - name: {{ $prefix }}IAM_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with $instance.publicUrl }}
            - name: {{ $prefix }}PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $instance.presignUrl }}
            - name: {{ $prefix }}PRESIGN_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if include "s3manager.instance.needsKeyPair" $instance }}
            {{- $secretName := include "s3manager.credentialsSecretName" $ }}
            {{- $accessKeyIdKey := printf "%sACCESS_KEY_ID" $prefix }}
            {{- $secretAccessKeyKey := printf "%sSECRET_ACCESS_KEY" $prefix }}
            {{- if $obcName }}
            {{- $secretName = default $obcName $instance.objectBucketClaim.secretName }}
            {{- $accessKeyIdKey = "AWS_ACCESS_KEY_ID" }}
            {{- $secretAccessKeyKey = "AWS_SECRET_ACCESS_KEY" }}
            {{- end }}
            {{- with $instance.existingSecret }}
            {{- if .name }}
            {{- $secretName = .name }}
            {{- $accessKeyIdKey = default "ACCESS_KEY_ID" .accessKeyIdKey }}
            {{- $secretAccessKeyKey = default "SECRET_ACCESS_KEY" .secretAccessKeyKey }}
            {{- end }}
            {{- end }}
            - name: {{ $prefix }}ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $accessKeyIdKey }}
            - name: {{ $prefix }}SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretAccessKeyKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.extraEnv }}
            {{- include "common.tplvalues.render" (dict "value" .Values.extraEnv "context" $) | nindent 12 }}
            {{- end }}
            {{- range $key, $value := .Values.envDict }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # multipart uploads are buffered here
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            {{- with .Values.tmpVolumeSizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
