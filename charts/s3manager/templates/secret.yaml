{{- if include "s3manager.hasInlineKeyPairs" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "s3manager.credentialsSecretName" . }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $index, $instance := .Values.instances }}
  {{- if include "s3manager.instance.hasInlineKeyPair" $instance }}
  {{- $prefix := printf "S3_%d_" (add1 $index) }}
  {{ $prefix }}ACCESS_KEY_ID: {{ $instance.accessKeyId | b64enc | quote }}
  {{ $prefix }}SECRET_ACCESS_KEY: {{ $instance.secretAccessKey | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
